# v0.23 分社团塌（分散式解体）并行通道 —— 预登记
# =====================================================================
# 纪律：先登记后计算。本文件登记时刻早于任何通道计算输出。
# 不动冻结层（v0.1—v0.4、v0.5—v0.22 产物、study.toml、标签/掩码/判定全不动）。
# 保留否定结果。全部结论限样本内描述性对账，不得外推。
#
# 污染披露（必须随结果一起引用）：
#   ① 2021 事件11 与 2026 L2/L3/N1/N3 的形态、有效维度、票数已在设计前被逐段查验；
#   ② 阈值锚点取自已验证的「坍缩≈1.2 / 分散≈3.3」分离带，不是逐事件调参，
#      但设计者已知哪些事件应当被捕获 —— 验证期只能作准样本外，不能称纯样本外。

[meta]
version = "v0.23"
name = "regime_parallel_channel"
registered_at = "2026-11-20T15:55:00+08:00"
supersedes = "无（新增并行通道，不替换 S3/B10/7票确认门/判型机）"
outputs = [
  "tda_project/outputs/regime_v023_parallel_channel_daily.csv",
  "tda_project/outputs/regime_v023_parallel_channel_events.csv",
  "tda_project/outputs/regime_v023_parallel_channel_summary.json",
]

[hypothesis]
# 病灶：七项确认票全是「市场塌成一条线」的签名（相关冲高/结构死亡），
# 分社团塌（有效维度高位、相关中低位、宽基仍深跌）被确认门家族假设整族漏掉。
# 假设：以「分散签名 + 深回撤」为确认的独立并行通道，能补上其中多数漏保事件，
#       且误报代价可接受。
# 否义：若通道补不上漏保、或误报不可接受，则假设不成立 —— 结果照样落盘报告。

[inputs]
# 拓扑/相关（与 paper_drafts/effective_dimension.py 同口径）
panel = "sw_industry_daily，2004-01 起覆盖率≥98% 的申万一级行业（19 个），日对数收益"
metric_window = 30              # 滚动窗（交易日）——主口径
metric_window_sensitivity = 40  # 敏感性口径（与前期长段分析一致）
pr_def = "PR=(sum lam)^2/sum lam^2，行业相关矩阵特征值参与比；1=坍缩，N=分散"
corr_def = "行业两两相关（上三角）中位数（与 effective_dimension.py dims() 一致）"
# 价格条件基准（冻结基准，全史 1999-12-30→2026-11-03，6483 日，real_wind_881001WI）
benchmark = "regime_v05_benchmark_daily.csv 的 benchmark_close（真万得全A 881001.WI）"
dd_def = "dd20 = close / rolling_max(close, 20) - 1，距 20 交易日滚动高点回撤"

[thresholds]
# 分散态判定（结构条件，两项同时满足）：
#   PR  ≥ pr_cut  且  corr ≤ corr_cut
# 主口径取固定水平，锚点=前期已验证的分离带：
#   坍缩态 PR≈1.08–1.27 / corr≈0.89–0.97（2008/2015/2016）
#   分散态 PR≈3.27–3.28 / corr≈0.47–0.49（2021 事件11、2026 L2）
#   全样本基准 PR≈1.74 / corr≈0.75；2021 后基准 PR≈2.86 / corr≈0.545
#   取 2.50/0.60 位于两类之间偏保守侧（离坍缩带更远）。
pr_cut = 2.50
corr_cut = 0.60
# 价格条件（危机响应条件，单独看是状态量、加此条才是响应）：
dd_cut = -0.08   # dd20 ≤ -8% 才算深回撤；敏感性 -6%/-10%
# 敏感性口径（不是备选主口径，仅报告稳健性）：
#   A：pr_cut/corr_cut 改训练期分位（PR≥p80、corr≤p20，标定期 2004→2025-04-07）
#   B：metric_window=40
#   C：dd_cut=-6% / -10%
#   敏感性结果只报告不择优，不回改主口径。

[fire_rule]
# 通道当日激活条件（三项同时成立）：
#   PR_30 ≥ 2.50  且  corr_30 ≤ 0.60  且  dd20 ≤ -8%
# 退出（滞回，防抖）：dd20 > -4% 即解除（结构条件不再要求）。
# 解除后 20 交易日线性回补（仓位 0.7→1.0，精神对齐回补B 的 20 日线性）。
# 通道独立于 S3：不要求 S3 先触发（S3 对慢速/结构型本身失明，见 v0.23 漏保账）。
active_position = 0.7
exit_dd = -0.04
recovery_days = 20

[plan]
# 固定预案，不判型、不买认沽、不设止损（第一版只测「仓位调制」这一件事）：
position = 0.7        # 通道激活期
put = false
stop_loss = false
recovery = "退出后 20 交易日线性 0.7→1.0"
# 与既有产品重叠时的合并规则不在本版评价范围；本版只做通道单独评价（对照=满仓）。

[evaluation]
train_period = "2004-01-01 → 2025-04-07（PR/corr 可用自 2004+30 日；dd20 可用全史）"
validation_period = "2025-04-08 → 2026-11-03（准样本外，见污染披露）"
# 事件级：
event_window = "onset 前 5 交易日 → worst_date（谷底）"
caught_def = "通道在 event_window 内有激活日（fire_offset=首次激活日-onset，负=提前）"
# 误报：
false_alarm_def = "激活日不在任何事件窗 [onset-5, label_end+20] 内"
false_alarm_unit = "日/年"
# 损益（简化、无成本，标注为上限口径）：
pnl_def = "对捕获事件，对照=满仓、通道=激活期 0.7 + 解除后 20 日线性回补，逐日复利 bmk_ret，窗口 onset→worst_date+20 日"
# 训练期重点：v0.23 漏保账中 2018 后 9 个可评估漏保事件（5/6/7/8/9/11/13/15/17）能补几个；
# 验证期重点：2026 L2/N2（6-18→7-30）、L3/N3（8-31→10-30）是否激活、偏移与简化损益。

[negative_criteria]
# 任一成立 → 通道不采纳（结果照样报告）：
reject_if_false_alarm_gt = "训练期误报 > 20 日/年"
reject_if_zero_catch = "训练期捕获漏保事件数 = 0"
reject_if_pnl_nonpositive = "训练期捕获事件简化损益差合计 ≤ 0"
# 验证期若 0 激活且训练期误报 ≤ 5 日/年 → 记「样本内外不一致」，人工判读，不自动通过。

[red_lines]
- 不得事后换窗口/阈值/预案追正；敏感性只报告不择优。
- 不覆盖任何既有产物；本版全部输出独立 v0.23 文件。
- 事件 11（2021）与 2026 各段在设计前已被查验 —— 结果不得表述为「预测成功」。
- 判型增强实验（门①）不在本登记范围，维持搁置。
