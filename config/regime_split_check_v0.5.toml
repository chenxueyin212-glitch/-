anchor_date = "2012-12-31"
anchor_close = 2223.24
front_start = "1999-12-30"
front_end = "2012-12-28"
back_end = "2026-11-03"

[benchmark.front_composite]
source = "a_share_pit/tdx_central.db :: index_daily_raw"
codes = ["000001", "399001"]
definition = "r_sse(t)=close_000001(t)/close_000001(t-1)-1; r_szse(t)=close_399001(t)/close_399001(t-1)-1; r_eq(t)=(r_sse+r_szse)/2; 链式累乘，绝不直接平均点位"
calendar = "两指数共同交易日（inner join）"
discipline = "该口径与用户 2026-11-06 已确认的 Gate 0 市场基准口径完全一致，不是新口径"

[benchmark.back_real_wind]
source = "outputs/xy_wind_all_a_daily_v04_full.csv (真 881001.WI, 3359 行, 2012-12-31..2026-11-04)"
