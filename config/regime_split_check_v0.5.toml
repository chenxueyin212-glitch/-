  "日期唯一且升序",
  "基准点位全为正、无 NaN、无 inf",
  "后段 3339 行 benchmark_close 与 v0.4 close_wind 逐值差 < 1e-9",
  "后段 3339 行 benchmark_close 与真 Wind CSV close 逐值差 < 1e-9",
  "2012-12-31 点位 = 2223.24",
