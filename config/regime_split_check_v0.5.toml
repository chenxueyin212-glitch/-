discipline = "后段逐值沿用 v0.4，不重算、不平滑、不覆盖"

[benchmark.splice]
method = "以 2012-12-31=2223.24 为锚，用各段日收益反向递推前段点位，得到一条连续链式指数；标签只依赖收益率，绝对水平差一个常数倍不影响任何标签"
boundary_rule = "收益按发生日归属：t<=2012-12-28 用合成日收益；t>=2012-12-31 用真 Wind 日收益；跨段那一日(2012-12-31)的收益归后段，用真 Wind"
no_level_jump = true
back_bitwise_identical = true

