# ===========================================================================
# v0.33 基准日历重建（预登记，先登记后计算）
# 建立时间：2026-11-22T14:35:00+08:00
# 触发事由：v0.32 采样审计发现 regime_v05_benchmark_daily.csv 仅 6483 日，
#           而 Wind 881001.WI 同期实有 6502 个交易日，缺 19 日。用户拍板「要的」。
# ===========================================================================
version = "v0.33"
title = "基准日历重建：881001.WI 全历史 6502 日替换 6483 日缺口版"
registered_at = "2026-11-22T14:35:00+08:00"
registered_by = "agent"
user_decision = "要的（回答「要不要立 v0.33，用 Wind 这 6502 天重建 bench」）"

[problem]
bench_file = "tda_project/outputs/regime_v05_benchmark_daily.csv"
bench_rows = 6483
bench_first = "1999-12-30"
bench_last = "2026-11-03"
wind_rows = 6502
missing_days = 19
missing_days_list = [
  "2015-07-15", "2015-09-02", "2015-11-27", "2016-04-18", "2016-04-19",
  "2016-07-04", "2017-04-05", "2017-07-21", "2021-08-06", "2021-10-08",
  "2021-10-22", "2022-03-03", "2022-03-23", "2022-03-31", "2022-04-14",
  "2022-05-05", "2022-05-09", "2023-09-08", "2026-10-15",
]
root_cause = "缺口位于 v0.5 后段，该段直接照抄 regime_daily_labels_v04.csv（3339 行）；v0.5 前端 3144 行取自 xy_wind_all_a_front_*.csv 完好。故缺口产生于 v0.4 标签日历，非 v0.5 拼接。"
impact_scope = [
  "S3 的 5 日简单收益和在跨缺口时实际跨 6-7 日",
  "20 日波动与 756 日滚动 70 分位的样本集偏移",
  "20 日高点回撤的窗口偏移",
  "B10 状态机的静默计数与冷却期错位",
  "账本少 19 个可交易日",
  "七票在 wide 面板少 19 行",
]

[data]
source = "Wind MCP get_index_kline"
windcode = "881001.WI"
period = "10"
begin_date = "1999-12-30"
end_date = "2026-11-03"
raw_file = "tda_project/outputs/v033_wind_raw/881001WI.json"
raw_rows_expected = 6502
close_field = "MATCH"
open_field = "OPEN"
high_field = "HIGH"
low_field = "LOW"
volume_field = "VOLUME"

[cleaning]
# 节假日填充行判据：四价完全相同，或成交量为空/非正
flat_rule = "OPEN == HIGH == LOW == MATCH"
volume_rule = "VOLUME is null or VOLUME <= 0"
drop_if = "flat or bad_volume"
expect_rows_after_clean = 6502
note = "若清洗后少于 6502，逐条列出被剔日期并记录；不得为凑数而放宽判据"

[validation]
gates = [
  "首日 close 必须为 1000.00",
  "清洗后行数必须等于 6502，不等则列明被剔日期",
  "与旧 bench 重叠日 close 最大绝对差 <= 1.0（旧版为拼接产物，已知约 0.74）",
  "19 个缺口日必须全部有值",
  "与 trade_calendar（有股票成交的交易日）做差集，差集必须为空",
  "日收益绝对值不得超过 15%，超出则列明",
  "日期唯一且升序",
]
fail_action = "任一硬门不过 -> 本版作废，结论写「基准不可重建」，回退旧文件并说明"

[recompute]
scope = [
  "S3 三条件与 raw_mask",
  "B10 状态机与 alarm 掩码",
  "45 事件窗口的 idx 重映射（onset/event_end 日期字符串不变）",
  "六臂账本与净账",
  "七票判定机（19 日特征缺失按不投票处理）",
]
s3_spec = "r5 = 5 日简单收益和 <= -0.04；vol20 = 20 日日收益标准差 > 756 日滚动 70 分位（min_obs=120）；dd20 = 距 20 日高点回撤 >= 0.05；三中二"
b10_spec = "静默满 5 日撤销 + 冷却 10 日；状态机逐日推进"
ledger_spec = "逐字复用 v0.19：基准仓位、深慢 0.5/止损 20%/买认沽、浅快 0.8/止损 12%/不对冲、回补 20 日、单位账与误报段损益差算术和"
judgment_spec = "逐字复用 v0.19 七票：a16 占 2 票 + 5 票特征；10 项 C1 口径 a 占 5；756 日滚动 85/15 分位；>=4 票候选；判型三票；连续 2 日同型切换"
judgment_note = "wide 面板无 19 日特征，这些日 ext_count 记 0（不投票），不重建 TDA、不改 PHTI 面板、不插值"

[metrics]
primary = ["all45_switched", "net_reference_F7K4"]
secondary = ["all45_type_correct", "false_cost", "false_days_pct", "raw_mask_days", "alarm_days"]
descriptive = ["19 日内新增 S3 触发日数", "19 日内新增告警日数", "触发日集合变动", "告警段数变动"]
[metrics.frozen_reference]
all45_switched = 19
all45_type_correct = 10
net_reference_F7K4 = 78.96
net_reference_F10K6 = 105.02
e2e_p4_p3_total = 147.5561
e2e_p1_p3_total = 180.3654
false_cost = -68.597
false_days_pct = 23.4
crisis_coverage = "45/45"

[decision_rule]
# 预先写死，出数后不得改判
robust = "all45_switched 变动 <= 1 且 |net_reference 变动| <= 5% 额度(<=3.95) -> 结论「主结果稳健，不需改写；论文加注基准日历已修正 19 日」"
changed = "超出上述幅度 -> 结论「主结果须改用 v0.33 数字」，v0.33 数字列为正式口径，旧数字保留为历史版本并注明缺陷"
no_go = "若 v0.33 使 45/45 覆盖或 19/45 切换发生结构性改变 -> 主结果作废，须重写第五章账本节并报用户拍板"

[protocol]
stopping_rules = [
  "禁止为使 v0.33 贴近 78.96 而调整 S3 阈值、窗口、分位或 B10 参数",
  "禁止把 2026 当作样本外",
  "禁止覆盖 v0.19/v0.21/v0.32 任何产物文件名",
  "禁止用插值或前向填充补 19 日",
  "禁止重建 TDA 面板以「顺便」补七票特征",
  "禁止以本版结果直接替换论文主结果，除非 decision_rule 判定为 changed",
]
prohibitions = [
  "不得删除 regime_v05_benchmark_daily.csv",
  "不得修改 config/study.toml",
  "不得改动冻结标签、掩码、判定口径",
  "全部结论限于样本内描述性对账，不外推",
]
outputs = [
  "tda_project/outputs/regime_v033_benchmark_daily.csv",
  "tda_project/outputs/regime_v033_benchmark_audit.json",
  "tda_project/outputs/regime_v033_s3_compare.csv",
  "tda_project/outputs/regime_v033_ledger_summary.csv",
  "tda_project/outputs/regime_v033_events.csv",
  "tda_project/outputs/v033_bench_rebuild_report.md",
]

