# Gate 0 v1.0（2026-11-07冻结）；开发实验默认禁止读取2025年起测试数据。
# 任何后续修改必须升版并保留本版输出，不得根据测试结果反选。

[protocol]
version = "gate0-v1.0-2026-11-07"
status = "frozen_for_development_oof"

[data]
db = "../a_share_pit/tdx_central.db"
start = "2005-01-04"
end = "2024-12-31"
test_start = "2025-01-01"
# 申万行业指数：True 时剔除各代码真实发布日之前的基日回填段
exclude_backfill = true
# 中证行业指数真实发布日，早于此日的一律视为事后回溯，不用于实时预警
csi_release_date = "2011-08-02"
# 分类版本断点：面板坐标不得跨断点静默拼接
classification_breaks = ["2014-02-21", "2021-12-13"]

[pointcloud]
# 滑动窗口长度（交易日）：X_t = { x_{t-w+1}, ..., x_t }
window = 50
# 首版切片第二轴采用 kNN 逆密度；correlation/liquidity 只能另作对照实验
second_axis = "density"

[label]
# Y_t = 1{ min_{1<=k<=horizon}( P_{t+k}/P_t - 1 ) <= drawdown }
horizon = 20
drawdown = -0.10
# 上证综指000001与深证成指399001简单收益每日等权并链式合成。
benchmark = "daily_equal_weight_000001_399001"

[split]
# 16行业主面板默认值；三面板各自设置见下方。purge由label_end日期判定。
initial_train_days = 700
val_days = 250
purge_days = 20
embargo_days = 0

# 16：长期连续一级行业；剔除市场表征、二级行业和2021版煤炭回填代码。
[panels.p16]
start = "2005-01-04"
initial_train_days = 700
val_days = 250
codes = ["801010", "801030", "801040", "801050", "801080", "801110", "801120", "801130", "801140", "801150", "801160", "801170", "801180", "801200", "801210", "801230"]

# 27：16个连续行业 + 2014年可实时使用的11个一级行业；不含2021版801950煤炭。
[panels.p27]
start = "2014-02-21"
initial_train_days = 250
val_days = 250
codes = ["801010", "801030", "801040", "801050", "801080", "801110", "801120", "801130", "801140", "801150", "801160", "801170", "801180", "801200", "801210", "801230", "801710", "801720", "801730", "801740", "801750", "801760", "801770", "801780", "801790", "801880", "801890"]

# 31：2021版一级行业；仅从真实发布日起使用。
[panels.p31]
start = "2021-12-13"
initial_train_days = 250
val_days = 125
codes = ["801010", "801030", "801040", "801050", "801080", "801110", "801120", "801130", "801140", "801150", "801160", "801170", "801180", "801200", "801210", "801230", "801710", "801720", "801730", "801740", "801750", "801760", "801770", "801780", "801790", "801880", "801890", "801950", "801960", "801970", "801980"]

[detector]
# 起点取 Guritanu 2025 因果版参数；本项目必须重新在训练段标定
alpha = 3.1
beta = 3.1
s = 57
t = 16
lead_days = 20
lag_days = 5

[evaluation]
trading_days_per_year = 244
