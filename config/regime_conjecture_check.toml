# 推测核对线规格（v0.1，在查看任何分组结果之前冻结）
# 与 Gate 0 / Gate 1 冻结协议完全分离；本文件不修改 config/study.toml
# 目的：验证此前「A 股危机前 / 危机中 / 牛市 / 熊市持续同调与持续摘要特征」的推测是否正确
# 性质：样本内描述性对账，不是策略绩效、不是确认性检验、不是预警系统设计

[meta]
protocol_id = "regime_conjecture_check"
version = "v0.1"
frozen_at = "2026-11-08"
status = "规格冻结，待执行"
user_decisions = [
  "日期用全日期，不截断到 2024-12-31",
  "2025-06 之后标『牛熊未定义』",
  "模糊带的 5% 指『跌破年线的幅度』",
  "缺 PE / 换手率 / 融资余额时改用用户三层截图规则",
  "粒度逐日",
]

[scope]
date_policy = "各数据源按各自覆盖范围全日期使用，不人为切断"
effective_labeled_window = "2012-12-31 .. 2025-05-30"
bull_bear_undefined_after = "2025-05-30"
undefined_reason = "万得全A 日线（outputs/xy_wind_all_a_daily.csv）止于 2025-05-30"
crisis_events = "outputs/xy_crisis_events.csv：17 段，首段左删失，16 个可用；止于 2025-03-07"
post_2025_06_usage = "仅保留摘要描述，不参与任何状态分组比较；单独计数披露"
gate1_boundary = "不加载 Gate 0 冻结的 2025 最终测试标签/评分；Gate 1 仍暂停、Gate 2 不启动"
forbidden_outputs = ["策略收益", "夏普", "PR-AUC", "仓位", "阈值反选", "按结果重划状态"]

[data_sources]
industry_daily = "../a_share_pit/tdx_central.db :: sw_industry_daily，1999-12-30..2026-11-03"
index_daily = "../a_share_pit/tdx_central.db :: index_daily_raw，1990-12-19..2026-11-04，含 000001/000300/000852/399001，字段 open/high/low/close/volume/amount"
equity_daily = "../a_share_pit/tdx_central.db :: equity_daily_raw，16770562 行 / 5221 代码，无 volume=0 行"
wind_all_a = "outputs/xy_wind_all_a_daily.csv，3012 行，2012-12-31..2025-05-30，仅 OHLC 无 volume"
xy_features = "outputs/xy_corrected_features.csv，3339 行逐日 12 摘要，2012-12-31..2026-11-03"
phti_daily_w = "outputs/phti_daily_w_p16_v0.2.csv / p27_v0.2.csv，4841 / 2627 行，止于 2024-12-31"
phti_section33_windows = "outputs/phti_section33_ashare_check.json :: pairs.*.window_rows，237 + 128 个月末窗口（仅月末，需补逐日）"
crisis_onset_audit = "outputs/xy_crisis_onset_tda.json，12 摘要危机前置换检验 + post-pre 对比"

# ---- 第一层：趋势确认（用户截图 1）----
[layer1]
logic = "三条同时满足才确认；都不满足则进入第二层"
change_from_original = "原截图为『满足 2/3』且熊市回撤阈值 30%；新规则改为『同时满足』且熊市回撤阈值 20%"
bull = [
  "close > MA250（年线）",
  "MA250 的 20 日斜率 > 0（年线向上走）",
  "从近 250 日最高点回撤 < 15%",
]
bear = [
  "close < MA250（年线）",
  "MA250 的 20 日斜率 < 0（年线向下走）",
  "从近 250 日最高点回撤 > 20%",
]
benchmark_primary = "万得全A close（wind_all_a）"
benchmark_sensitivity = "上证综指 000001 close（index_daily_raw，可延长至 2026-11-04，仅作敏感性，不改主口径终点）"
ma250_slope_primary = "MA250(t) - MA250(t-20)"
ma250_slope_sensitivity = "MA250 过去 20 日线性回归斜率"
drawdown_definition = "close(t) / max(close[t-249..t]) - 1"
warmup = "前 250 个交易日不足以判 MA250 / 250 日高点，标『未定义』"

# ---- 第二层：市场宽度（用户截图 2）----
[layer2]
trigger = "第一层未确认（模糊带）"
logic = "偏多满足任意 2 项 → 牛市中的调整（继续看多）；偏空满足任意 2 项 → 牛转熊（降仓）；两者都不足 2 项 → 保持『模糊』"
bull_items = [
  "A: 全A中 close > MA20 的个股占比 > 60%",
  "B: 中证1000 / 沪深300 的 60 日变化率 > +5%（小盘走强 = 杠杆资金在进）",
  "C: 成交量的 250 日分位数 > 50%（量能温和放大，不是缩量反弹）",
  "D: MA20 > MA60（短期均线多头排列）",
]
bear_items = [
  "A: 全A中 close > MA20 的个股占比 < 40%",
  "B: 中证1000 / 沪深300 的 60 日变化率 < -5%（小盘跑输 = 杠杆资金在撤）",
  "C: 成交量的 250 日分位数 < 50%（缩量阴跌）",
  "D: MA20 < MA60（短期均线空头排列）",
]
item_A_denominator = "当日 equity_daily_raw 中有记录且 volume>0 的个股数"
item_A_caveat = "库中停牌股直接缺行（无 volume=0 记录），分母会自动缩小；2015-07 千股停牌时宽度占比会被系统性高估，须单独标注"
item_A_coverage = "代表日行数 2005-06-15=1151 / 2015-06-15=2135 / 2018-06-15=3105 / 2021-06-15=4132 / 2024-06-17=5019 / 2026-06-15=5175；分母随时间变化，须逐日披露"
item_A_missing_days = "部分交易日整库无个股记录（如 2010-06-15 为 0 行），标签日历须按实际有数据日期对齐，不用理论交易日历"
item_B_ambiguity = "『中证1000 / 沪深300 的 60 日变化率』两解：B1 = 比值(000852/000300) 的 60 日变化率；B2 = 两者各自 60 日收益之差。两解都算、全披露、不反选"
item_C_ambiguity = "『成交量』两解：C1 = 全 A 成交额当日汇总的 250 日分位；C2 = 上证 000001 指数 volume 的 250 日分位。万得全A CSV 无 volume，不能用它。两解都算、全披露"
item_D_benchmark = "与 layer1 同一基准 close"

# ---- 第三层：过热 / 超冷（用户截图 3）----
[layer3]
usage = "仅作附加标签，不参与牛熊判定；用于识别『危机前放量型 / 脆弱期』，与推测的放量-缩量分型对应"
bull_overheat_any_1 = [
  "BIAS250 的 60 日 z-score > +2",
  "RSI(14) on 万得全A > 80 且连续 5 个交易日不回落",
  "涨停家数 / (涨停+跌停) > 85% 且涨停家数 > 80",
  "价格 750 日分位数 > 90%",
]
bear_oversold_any_1 = [
  "BIAS250 的 60 日 z-score < -2",
  "RSI(14) < 20",
  "涨停/(涨停+跌停) < 15% 且跌停家数 > 50",
  "价格 750 日分位数 < 10%",
]
bias250 = "(close - MA250) / MA250；再取过去 60 日 z-score"
limit_up_down_caveat = "库中无涨跌停字段，只能按 close/prev_close 阈值近似（10% / 20% / 5% 随板块与年份变化），且需用 xdxr 过滤除权日；标『近似』并做阈值敏感性，不进主判据"

# ---- 原截图模糊带触发器 ----
[legacy_fuzzy_trigger]
status = "含义已由用户确认，但新三层规则中无位置；登记为附加敏感性，不进主口径"
definition = "跌破年线后 10 个交易日内收盘是否重新站上 MA250；跌破幅度 = (MA250 - close)/MA250 < 5% 视为浅跌"
original_text = "收复 = 牛市中继；未收复且回撤扩大 = 逐步降仓"

# ---- 已知结构性问题 ----
[known_biases]
bear_label_lag = "熊市②回撤>20% 属事后触发，标签会系统性滞后于危机起点并与『危机中』重叠；须单列滞后天数并把『熊市∩危机中』拆成独立一格"
states_not_exclusive = "四状态不互斥（2015 牛顶既是牛市也是危机前）；输出主标签 + 叠加标签两栏"
window_smoothing = "逐日摘要仍是过去 60 日窗口的函数，天然带平滑与滞后；看『爆发初期』时须注明这是窗口组成变化而非当日结构"
self_reference = "推测本就由同一批摘要数字推出，『支持』多为同源自证；报告须分列『原有实测已决定』与『本次新增信息』"

# ---- 评估口径 ----
[evaluation]
granularity = "逐日"
group_stat = "各状态 × 各摘要的中位数、相对常态效应量、区块自助 95% CI（block=20 交易日）"
no_naive_t = true
dedup = "危机段按 16 个事件起点计，不做日级重复计数（沿用 389 日→40 簇的教训）"
scale_residual = ["W2 / RV20", "H0 death / 窗口 RMS 距离", "W2 对 RV20 + 平均相关 + 第一特征值占比回归后的残差"]
disclosure = "全格披露：所有状态 × 所有摘要 × 两条点云 × 歧义双解；未校正与 Bonferroni(12) 两栏都给"
verdict = ["支持", "矛盾", "无法判定（含数据不足）"]
multiple_label_versions = ["主口径（万得全A + B1 + C1）", "敏感性：基准换上证", "敏感性：B2", "敏感性：C2", "敏感性：legacy 5% 触发器"]

# ---- 阶段 A：断言清单（零计算，先分档再看数）----
[conjectures]
C01 = "危机中尺度摘要（W2、landscape L1、H0 death、H1 birth/寿命）随已实现波动上升｜直接实测：section33 spearman 0.961/0.968、0.849/0.839、0.669/0.537"
C02 = "危机中尺度摘要几乎可被 RV20 + 平均相关 + 第一特征值占比解释，无独立结构信息｜间接推断（有高相关，未做残差检验）"
C03 = "危机中尺度摘要峰值滞后于危机起点｜完全没测过（可用逐日 W2 立即检验）"
C04 = "危机前形状摘要与常态无稳定差异｜部分实测（xy_crisis_onset 12 摘要 Bonferroni 全不显著），但口径是『危机前 vs 同年随机日』，非四状态分组"
C05 = "缩量型危机前尺度摘要落最低分位 → WCP 满仓｜完全没测过（放量/缩量分型未做）"
C06 = "放量型危机前尺度摘要已偏高｜完全没测过（layer3 过热标签可作独立代理）"
C07 = "危机中 H1 数量下降｜口径不同/过度外推（13→10、10→8，rho -0.070/-0.142 不显著；爆发初期造环与灭环机制相反，须双侧检验）"
C08 = "危机前 H0 death CV 低、边长齐｜过度外推（实测只有 rho≈0 的无关性，推不出水平判断）"
C09 = "牛市 vs 熊市在尺度水平、共同因子强度、防御/成长双簇上有差异｜完全没测过"
C10 = "窗口填满后 H1/H2 趋于消失（一维塌陷）｜部分实测（极端窗口相关 0.554→0.942、特征值比 4.85→33.6），未做四状态分组"
C11 = "爆发初期 60 日混合窗口制造长寿命 H0 / 假 H1 环｜完全没测过（需补逐日形状摘要）"
C12 = "兴业 N 在危机前中高位｜已被否证方向（13 个高 N 信号 precision lift 全<1），且 N 受节点数漂移驱动；本轮不对 N 设方向假设"
C13 = "危机中摘要被停牌稀释平滑、涨跌停削顶污染｜部分可测（涨跌停家数可近似；停牌家数只能靠『当日缺行』近似），本地无直接字段"
C14 = "W 的变化率 / 跨簇重配对比例领先危机｜完全没测过，探索性猜想，不作主假设"

# ---- 明确不做 ----
[not_allowed]
items = [
  "读取 Gate 1 冻结的 2025 最终测试集（状态点云 H0/H1 + 逻辑回归评分数据）",
  "计算策略收益 / 夏普 / 回撤 / PR-AUC / 仓位曲线",
  "按分组结果反选状态划分、阈值、摘要或面板",
  "修改 config/study.toml 或任何 Gate 0/1 冻结文件",
  "把结论外推为『TDA 对 A 股危机预警有效/无效』",
  "启动 Gate 2 或运行 PHTI 正式绩效回测",
]
