# =====================================================================
# 预登记：v0.14 误报治理——警报态撤销与冷却期（先登记后计算）
# 登记时间：2026-11-14T12:51:03+08:00
# 登记于任何计算之前。本文只追加、不回改；更正进追加修订区。
# ---------------------------------------------------------------------
# 背景与目标（用户 2026-11-14 指令）
#   v0.13 已达成 45/45 全识别（实用候选政策），但警戒态占历史 50%、
#   误报 62.0 日/年、21.6 段/年且碎片化（顶部警觉频闪）。
#   v0.13 报告承诺的下一步：误报治理（撤销机制＋冷却期），针对短促误报，
#   做到之后再谈把警戒占比从 50% 压下来。用户指令：现在试一试。
#   → 本版在【冻结的实用候选原始命中掩码】之上加【警报态治理层】：
#     撤销（250 日线收复即解除＋静默兜底）与冷却期（撤销后抑制再点燃）。
#   → 词表与组合一字不改；只改「警报态」的开合逻辑。硬红线 = 不丢召回。
# =====================================================================

[meta]
version = "v0.14"
title = "误报治理——警报态撤销与冷却期"
created = "2026-11-14T12:51:03+08:00"
purpose = "在不丢 45/45 召回的硬约束下，用撤销机制与冷却期治理短促误报（碎片化频闪），量化误报日/年、误报段/年、警戒占比的压缩幅度与被抑制命中的召回风险。"
discipline = "先登记后计算；治理参数全部计算前固定、9 变体同表保留无论好坏不删；无随机数、无参数反选。"

# ---------------------------------------------------------------------
# 一、底座（冻结，一字不改）
# ---------------------------------------------------------------------
[base]
policy = "原始命中掩码 = v0.13 实用候选（P8 = 弱三中二 ∪ 单日跳水 ∪ 回撤警报 ∪ 拓扑放宽 ∪ 顶部预警）逐字重建。"
lexicon = "15 信号阈值、756 日分位窗、最少观测数全部沿用 v0.13 冻结值，不重调。"
sample = "45 个冻结统计事件（前段 28：101—128；后段 17：1—17），起止沿用 v0.12 触发表。"
calendar = "regime_v07_split_wide.csv 全日历 6483 个交易日。"
disclose = "本版治理层只作用于警报态开合；原始命中掩码是治理层的输入，不得被治理层修改。"

# ---------------------------------------------------------------------
# 二、识别窗与误报归属（与 v0.13 逐字同口径）
# ---------------------------------------------------------------------
[identification_window]
pre = "起点前 20 个交易日内出现警报态开日 → 分档『提前』"
in_window = "起点日至事件结束日出现警报态开日 → 分档『窗内』"
damage_window = "事件结束后 20 个交易日内出现警报态开日 → 分档『损伤窗』"
miss = "事件结束 +20 日仍无警报态开日 → 分档『漏』"
hit_day = "命中日 = 识别窗内首个警报态为开的交易日（无论当期转入还是此前已开仍在持续）。"
headline = "完全识别数 = 提前 + 窗内 + 损伤窗。主表三档分列，不许合并冒充。"

# ---------------------------------------------------------------------
# 三、警报态状态机（本版核心，语义精确冻结）
# ---------------------------------------------------------------------
[alert_state]
states = "警报态 ∈ {关, 开}；另有冷却抑制期计数。"
light_up = "关→开：当日有原始命中，且不在冷却抑制期。"
hold = "开态持续到撤销条件满足；开态期间当日原始命中把静默计数清零。"
revoke_day = "撤销条件在第 t 日收盘判定；满足则第 t 日计为关（当日不计警报日），第 t 日是警报日的最后一日的次日之前一日——即开态覆盖点亮日至撤销日前一日。"
edge_case = "当日既有原始命中又看似满足撤销条件：有命中则静默计数为 0，撤销条件（均要求连续无命中）不满足，不冲突。"
ma250 = "250 日均线 = 收盘的 250 交易日简单均线，最少满窗观测；观测不足的早期按不满足处理（走静默兜底）。"

[revocation]
# 两条撤销规则，变体层各占一半，同表对照
rule_A = "收复＋静默（主）：（连续 3 个交易日无原始命中 且 该 3 日收盘均 ≥ 250 日均线）或（连续 5 个交易日无原始命中）——先到先撤。前者即『250 日线收复即解除』，后者是静默兜底。"
rule_B = "纯静默（对照）：连续 5 个交易日无原始命中即撤。"
mechanism_note = "撤销规则自带迟滞合并：点亮后 5 日内的频闪不再拆段，天然把短促误报并成一段。"

[cooldown]
definition = "撤销日的次一交易日起，连续 C 个交易日内原始命中不点亮警报态（被抑制、逐条记账）；冷却最后一日结束后恢复点亮资格。"
scope = "冷却对所有撤销一视同仁（包括真事件窗内的撤销）——实盘没有事后视角，不得按识别窗豁免。"
zero = "C = 0 = 只撤销不冷却。"

# ---------------------------------------------------------------------
# 四、变体表（9 行，计算前固定，无论好坏不删）
# ---------------------------------------------------------------------
[variants]
G0 = "原始（无治理）= v0.13 实用候选原样，对照行"
A0 = "撤销规则甲（收复＋静默）＋冷却 0 日"
A5 = "撤销规则甲＋冷却 5 日"
A10 = "撤销规则甲＋冷却 10 日"
A20 = "撤销规则甲＋冷却 20 日"
B0 = "撤销规则乙（纯静默）＋冷却 0 日"
B5 = "撤销规则乙＋冷却 5 日"
B10 = "撤销规则乙＋冷却 10 日"
B20 = "撤销规则乙＋冷却 20 日"
grid_note = "冷却档 0/5/10/20 = 不冷却 / 一周 / 两周 / 一月（机制驱动的日历锚点）。"

[selection_rule]
hard = "硬资格：治理后完全识别必须 45/45（一个不漏）——召回是用户钉死的地基。"
primary = "合格者按误报日/年升序取小（本版目标 = 误报治理）。"
tie = "并列依次取：提前数大 → 误报段/年小 → 冷却期短 → 撤销规则乙（机制更简单）。"
timing_disclose = "提前数（保护时点）逐行披露；若获胜行提前数 < 45，必须点名被拖延的事件与拖延天数——时点退让是误报治理的价码，不许藏。"
no_qualified = "若无一行通过硬资格：如实报告『本版治理设计伤害召回』，只作不合格描述行（识别数、提前数优先取伤害最小），标注不得推荐。"
g0_default = "对照行 G0 参与排序；若治理各行全不合格，G0 默认胜出 = 『治理没做出来』，如实报告。"

# ---------------------------------------------------------------------
# 五、记账指标（治理后警报态上重算，口径与 v0.13 同）
# ---------------------------------------------------------------------
[false_alarm]
definition = "警报态为开且不在任何识别窗 [起点−20, 事件结束+20] 内 = 误报日。误报段 = 连续误报日的最大连续段（识别窗边界处切断）。"
metrics = "误报日数/年、误报段数/年、最长误报段、警戒态占历史比（警报日数/6483）、识别窗内警报覆盖日数。"
governance_metrics = "撤销次数（规则甲分列：收复撤销 / 静默撤销）、冷却抑制原始命中日数（合计 / 其中落在识别窗内）、窗内撤销次数（识别窗内发生的撤销——中途撤防风险）。"
recall_risk = "被冷却抑制且落在识别窗内的命中逐条列表（日期、事件号）——召回风险审计，丑话前置。"
comparability = "误报段定义与 v0.13 同（识别窗边界切分、逐日归属）；G0 行必须与 v0.13 实用候选数字完全一致（对账断言）。"

# ---------------------------------------------------------------------
# 六、口径与红线
# ---------------------------------------------------------------------
# ---------------------------------------------------------------------
[accounting]
clock = "只做触发层警报态治理研究；判定机/预案/损益模拟不做（治理生效后接回 v0.12 引擎做端到端是下一步，本版不做）。"
timing = "治理后首次命中偏移 = 识别窗内首个警报态开日相对起点偏移；另记相对原始首响的拖延天数。"
safety = "识别评估在治理后警报态上进行（诚实口径）；同时保留原始首响作对照，拖延逐事件披露。"

[prohibitions]
- 不改 v0.13 词表/组合/阈值——原始命中掩码冻结
- 不按 45 事件结果反选撤销规则或冷却参数——9 变体同表保留
- 不得按识别窗豁免冷却（禁用事后视角）
- 不把本版结果表述为实盘可达；全部为样本内描述性对账
- 不做显著性宣称；不做损益模拟
- 2025 测试集封存不动；不重判 v0.5 冻结判定

[outputs]
o1 = "outputs/regime_v014_governance_summary.csv（9 变体汇总）"
o2 = "outputs/regime_v014_governance_matrix.csv（45 事件 × 9 变体命中时点对照）"
o3 = "outputs/regime_v014_governance_episodes.csv（误报段记账，全部变体）"
o4 = "outputs/regime_v014_governance_suppressed.csv（冷却抑制命中明细，召回风险审计）"
o5 = "outputs/regime_v014_manifest.json（清单与哈希）"
report = "outputs/crisis_falsealarm_governance_v014_report.html"

[acceptance]
- 完整脚本独立运行两次，数据产物字节一致（清单时间戳除外）
- G0 行与 v0.13 实用候选汇总逐字段一致（对账断言）
- 45 事件全部入账、9 变体全出数
- 可见文本零英文缩写（工程字段名只放悬停 title）

