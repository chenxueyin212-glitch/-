# regime_topo_probe_v0.24.toml —— 拓扑分散签名探测臂
# 先登记后计算。登记时钟读数 2026-11-20T16:34:36+08:00，早于本臂任何计算输出。
# 目的：回答「第二台报警器（v0.23 并行通道）能否改用/加用拓扑指标」。
# 本臂是探测（probe），不改写 v0.23，不触任何冻结层；升不升产品由用户拍板。

[meta]
version = "v0.24"
registered_at = "2026-11-20T16:34:36+08:00"
purpose = "拓扑高侧签名（环/空腔增生）作为分散式解体报警器的候选口径探测"
status = "exploratory_probe"
supersedes = ""            # 不取代任何已有臂
output_prefix = "regime_v024_topo_probe"

[假设]
# 分散式解体（社团化、结构不塌反增生）的拓扑签名 = H1/H2 高侧；
# 与主确认门相反（主门要结构死亡 = H1/H2 低侧 ≤0.15）。
# 机制锚：Halperin 2026 分散式解体；C09 防御/成长双簇、C14 跨簇重配对（冻结猜想，未测）。
h1 = "b_h1_count 高侧 与分散式解体事件共现"
h2 = "b_h2_count / b_h2_landscape_l1 高侧同理"
h3 = "拓扑签名 + 深回撤门 与 v0.23 相关几何签名相比：捕获不劣、误报同量级"

[阈值来源]
# 全部继承，零新拟合：
pct_threshold = 0.85      # v0.16 票箱冻结的极值分位
low_threshold = 0.15      # 同上（R5 对照臂用）
dd_cut = -0.08            # v0.23 主口径
exit_dd = -0.04           # v0.23 主口径
pos_active = 0.7          # v0.23 主口径
recovery_days = 20        # v0.23 主口径
hist_window = 756         # v0.16 票箱滚动窗
min_periods = 120         # 同上

[分位口径]  # 两种都算，禁止事后只报好看的那个
A = "756 日滚动 rank 分位（与票箱同口径，无前视；2021 后中枢漂移可能稀释高侧）"
B = "固定训练参照分位：1999-12-30→2025-04-07 全训练样本经验 CDF，套用全历史各日"
C = "descriptive_only: 距 250 日滚动均值的 z 分数，只描述不设规则"

[候选规则]  # 分位口径 A 与 B 各跑一遍；R3 若特征退化（大量并列 0）如实记录
R1 = "b_h1_count pct >= 0.85"
R2 = "b_h2_count pct >= 0.85"
R3 = "b_h2_landscape_l1 pct >= 0.85"
R4 = "R1 OR R2 OR R3（拓扑合并臂）"
R5 = "对照: b_xy_h0_death_mean pct <= 0.15（主门传染票同口径，预期共动段响）"
R6 = "R4 OR (pr30>=2.50 AND corr30<=0.60)（加装臂：拓扑与 v0.23 相关几何取并集）"
R0 = "基线对照：v0.23 主口径（直接引用 regime_v023_parallel_channel_daily/summary，不重算）"

[评价口径]  # 与 v0.23 逐字相同
state_machine = "激活=规则AND dd20<=-8%；退出=dd20>-4%（滞回）；解除后 20 日线性回补 0.7→1.0"
coverage_mask = "45 事件窗(onset-5 → label_end+20) ∪ v0.18 验证期六段窗(同样±5/20 缓冲)"
false_alarm = "激活日 & ~covered；训练期= <=2025-04-07，验证期= >=2025-04-08"
event_pnl = "onset→worst+20td 简化损益：满仓 vs 通道仓位，乘积口径（同 v0.23）"
neg_gates = [
  "训练期误报 > 20 日/年 → 否",
  "训练期可评估漏保 9 事件捕获 = 0 → 否",
  "训练期捕获事件简化损益差合计 <= 0 → 否",
]

[污染披露]
# 设计前已逐段查验 2021-02（E11）、2022-09（E13）、2026 各段（L2/L3/N3）。
contamination = "2021/2022/2026 目标段在设计前均被人工查验；本臂仍是样本内探测，2025-04-08 后为准样本外"
escalation = "若探测通过且用户拍板升通道，须另立正式版（v0.25）并在论文披露本探测臂先于正式版存在"

[禁止]
b1 = "不改写 v0.23 及任何冻结文件"
b2 = "R1-R6 全部不过否定门槛则保留否定结果如实报告，不得换阈值/换窗/换特征追正"
b3 = "若要试其他口径（delta、全样本实时分位、其他拓扑特征组合），另立探测臂另行登记"
b4 = "R3 特征若退化，报退化事实，不换用别的景观指标顶替"
