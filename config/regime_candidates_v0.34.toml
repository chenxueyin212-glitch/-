# ---------------------------------------------------------------------------
# 四、判据与决策规则
# ---------------------------------------------------------------------------
[criteria]
[criteria.gate_1_fidelity]
name = "旧日历保真自检"
rule = "同一套代码在旧 bench 上重跑，A/B/C/D 四项的 switched_n、e2e_p4_p3_total、false_cost_total、false_activated_n、net_reference 与 reference_old_calendar 偏差均 ≤1e-3"
on_fail = "停止，不出新日历结果，先查实现差异"

[criteria.gate_2_calendar]
name = "日历与特征完整性"
rule = "新 bench 6,502 行；与 trade_calendar 双向差集为空；特征缺失天数 = 19（与 v0.33 一致）"
on_fail = "停止"

[criteria.gate_3_invariance]
name = "触发层不变量"
rule = "A/B/C/D/E1-E4 的 identified=45、tiers=24/7/14、catchable=31、alarm_day_share 完全一致；F/G 只允许 alarm 层不同"
on_fail = "停止"

[criteria.primary]
name = "候选增量稳定性"
definition = "R 的独立增量 = net(rolling) − net(single)，在两套确认层上分别计算；C1 的增量 = net(B) − net(A)"
tolerance = 1.0
pass_rule = "新旧日历下 R 增量之差的绝对值 ≤1.0，且 C1 增量之差的绝对值 ≤1.0"

[criteria.secondary]
name = "候选排序稳定性"
definition = "按 net_reference 降序排列 A/B/C/D"
pass_rule = "新旧日历下排序完全一致"

[criteria.tertiary]
name = "结构性指标不变性"
definition = "switched_n、first_type_correct_n、false_activated_n、false_episodes"
pass_rule = "新日历下与旧日历逐项相同"

[criteria.quaternary]
name = "消融符号不变性"
definition = "F（S3 无状态管理）应显著低于 A；G（C2）应低于 A"
pass_rule = "符号不变，且 |Δnet| ≤1.0"

[decision]
[decision.candidate_stable]
condition = "gate_1..3 全过 且 primary、secondary、tertiary、quaternary 全过"
action = "论文候选表的净损益差按新日历数值替换，候选排序与增量表述不改；须在方法/局限加注基准日历修正"

[decision.candidate_shift]
condition = "gate_1..3 全过，但 primary 或 secondary 未过"
action = "逐项报告变动；不得据此更换最终产品，须由用户拍板；禁止事后调参追回旧数字"

[decision.abort]
condition = "gate_1 或 gate_2 未过"
action = "本版作废，不出结论"

