# =====================================================================
# 预登记：产品二核心验证——四路径反事实损益
# 版本：v0.11
# 登记时间：2026-11-13T14:03:15+08:00
# 登记于任何 v0.11 计算之前
# =====================================================================

[meta]
purpose = "产品二（危机类型条件化预案）的核心验证：在『触发已给定』的前提下，逐日判定 + 四路径反事实损益，回答『深慢砍、浅快不砍』比不切换或切错值多少钱。"
registered_before_results = true
base_version = "v0.7 整合 + v0.8 分型 + v0.9 日级检测 + v0.10 交互检验"
not_a_trading_system = true
not_a_rejudge_of_v0_5 = true
note = "本版是反事实记账，不是策略收益宣称。回测里事件识别是已知答案（冻结标签起点日），故结论是实盘的上限——检测层的漏报、误报、延迟在回测里被消掉了，这句丑话写在最前面。"

[problem]
core_question = "如果实盘中按逐日判定切换预案，能比『不切换』或『切错』省多少钱？"
unit = "每单位初始资本的累计收益（百分点）"
sample_internal = "全部为样本内描述性对账；不外推为预警有效或无效；2025 年最终测试集继续封存"

# ---------------------------------------------------------------------
# 一、第 0 天定义与双轨触发（产品触发规格 + 回测口径）
# ---------------------------------------------------------------------
[day0]
backtest_day0 = "冻结标签事件起点日（检测层在回测里是已知答案，不测）"
detection_note = "回测只测分类层 + 响应层；检测层误差（漏报/误报/延迟）被『已知起点』消掉，如实披露"

[event_sudden_track]
# 产品实盘触发轨（本版只登记规格，不模拟事件识别本身）
condition = "重大事件命中以下五类之一 且 价格确认通过 → 记为第 0 天（典型延迟 0 至 1 日）"
categories = [
  "重大政策突变（意外降准加息、监管新规、紧急会议）",
  "地缘政治冲击（战争爆发、制裁、断供）",
  "系统性风险事件（金融机构暴雷、流动性枯竭）",
  "公共卫生与自然灾害（疫情、重大灾害）",
  "重大市场机制变化（熔断、涨跌停制度改革）",
]
historical_examples = "2015-06 杠杆清理、2016-01 机制变化、2020-02 公共卫生、2022-02 地缘、2024-10 政策剧变"
backtest_note = "回测中事件类别标注为事后已知，不逐事件人工归类（本版不需要）；实盘需事件信息源（新闻/公告监控），回测结果是实盘的上限"

[price_confirmation]
# 与实盘共用的同一套规则；回测里跑一遍它是为了如实报告『起点被拖后多少』
window = "起点日当天或之前 2 个交易日内"
rule = "满足任一即可：① 单日跌幅 ≤ −2.5%；② 隔夜跳空 ≤ −1.5% 且 当日成交额 ≥ 前 20 交易日均额的 1.5 倍；③ 5 个交易日累计跌幅 ≤ −6%"
sub_rule_2_fallback = "均量窗取 [当日−20, 当日−1] 与可用日的交集；可用日 < 15 时子规则②记为不可用（不触发），其余子规则照常"
audit = "逐事件报告：是否在窗内通过、命中日、命中子规则；未通过者如实标注『价格确认抓不住，实盘需区间检测轨』"

[interval_detection_track]
# 产品实盘的机械兜底轨（本版登记规格 + 只做触发延迟审计，不改变第 0 天）
rule = "满足 3 条中的 2 条即发出危机区间信号：① 5 个交易日累计跌幅 ≤ −6%；② 20 日已实现波动率 > 过去 3 年（756 交易日）的 80 分位；③ 收盘价 < 250 日移动平均线"
role = "多信号组合，抓事件突发轨抓不到的慢熊/浅快型；典型延迟 2 至 5 日"
audit = "逐事件报告：区间检测轨在 [起点−20, 起点+10] 内的首次信号日与相对起点的延迟"

[topology_warning]
# 最早的预热层（v0.9 问题一成果）
rule = "7 项危机敏感特征中 ≥ 4 项进入各自滚动 3 年历史的 85 分位（方向感知）→ 标记警戒态"
role = "只警戒、不计时、不单独触发（v0.9 结论：区分度 0.61–0.65，须叠加、不能单飞）"
audit = "逐事件报告：[起点−30, 起点] 内首次 ≥4 项极端的日期与提前量"

[slow_confirmation]
rule = "250 日线仅作产品实盘的确认/撤销层：触发后 20 日内破位确认危机区间；20 日内未破位且价格收复 → 撤销警戒。本版不模拟。"

# ---------------------------------------------------------------------
# 二、逐日判定（主口径；第九版 k=5 一次性判定降级为对照口径）
# ---------------------------------------------------------------------
[daily_judgment]
judgment_start = "触发后第 1 个交易日（不攒数据，逐日开口）"
judgment_window = "第 1 至 20 个交易日（其后判定冻结）"
feature_baseline_window = "第 0 天前 10 个交易日（常态参照）；非空 ≥ 8 才算有效"
feature_current_window = "第 0 天至第 k 日（含）；非空 ≥ 80% 才算有效"

crisis_confirmation = """
危机确认分 = 7 项危机敏感特征中当日进入极端状态的项数 / 7；
极端 = 方向感知：升向特征超滚动 3 年历史 85 分位，降向特征低于滚动 3 年历史 15 分位；
滚动窗 [当日−756, 当日−1]，历史观测 < 120 时该特征当日记『非极端』（不虚增确认分）；
分母固定 7。
"""
crisis_features = [
  "a16_avg_pair_corr（升）",
  "a16_leading_eig_share（升）",
  "b_industry_average_correlation（升）",
  "b_h2_count（降）",
  "b_h1_count（降）",
  "b_h2_landscape_l1（降）",
  "b_xy_h0_death_mean（降）",
]

type_score = """
类型分（深慢票占比）= 三项特征的等权投票：
  Δ = mean(第0天..第k日) − mean(第0天−10..第0天−1)；
  尺度均方根（a16_window_rms）Δ > 0 → 深慢票；
  平均两两相关（a16_avg_pair_corr）Δ > 0 → 深慢票；
  相关网络零维死亡值（b_xy_h0_death_mean）Δ < 0 → 深慢票；
类型分 = 深慢票数 / 有效票数；有效票 < 2 → 该日记『数据不足』（不算同向）。
判定：类型分 ≥ 2/3 判深慢；≤ 1/3 判浅快。
"""
type_direction_note = "三票的方向约定取自第十版交互检验的样本内方向（深慢型：尺度升、相关升、零维死亡值降），属样本内知识固化，如实披露；权重等权、不反选。"

switch_rule = """
切换条件 = 同一类型判定连续 2 个交易日，且确认日（第 2 日）危机确认分 ≥ 4/7；
确认日收盘切换（次一交易日起按预案仓位计损益）；
切换资格另要求 确认日 < 事件结束日（危机尚未结束，至少留 1 个在危机内的生效日）；否则记『未切换——危机窗口内无法确认』。
"""
correction_rule = "切换后持续逐日更新；若判定连续 2 日翻转且确认日危机确认分 ≥ 4/7，允许切回，最多纠错 1 次；此后锁定至回补期结束。"

# ---------------------------------------------------------------------
# 三、预案动作表（冻结，不反选）
# ---------------------------------------------------------------------
[plans]
baseline = "满仓 100% 纯持有（『统一不砍』对照）。核心层测的是『砍不砍』的仓位价值；常规止损属日常出场机制（产品三范畴），不进本版，另以敏感性口径 P3b 对照。"
deep_slow = "总仓降至 50% + 买虚值认沽对冲 + 止损 20%"
shallow_fast = "总仓降至 80% + 不对冲 + 止损 12%（轮动已删；防御倾斜属增强层，本版不做）"
undetermined = "维持基线（拒绝在信息不足时下重手）"
data_basis = "深慢型危机段最大回撤中位 −7.57%、事后恢复 −1.56% → 砍仓损失小、对冲有肉；浅快型回撤中位 −3.97%、事后 20 日 −6.16% → 切换滞后容易砍在低位，核心价值是『不砍在低点』"

[stop_loss]
anchor = "预案生效日收盘（预案止损是预案的组成部分，自生效日起算）；基线主口径无止损"
rules = "深慢 −20%、浅快 −12%（基准指数自生效日起累计跌幅）；触发后仓位归零至事件结束日，不因后续收复而回补；不因切换而恢复"
sensitivity_P3b = "基线对照口径：满仓 + 常规止损 8%（自第 0 日锚定），仅报损益数字，不改主结论口径"

[hedge_put]
approximation = "合成虚值认沽（无期权数据，简化记账）：生效日收盘 S0，行权价 K = 0.95 × S0，名义 = 0.5 单位初始资本（与降仓后持仓等额）"
premium = "权利金 = 名义 × 1.5%（生效日收盘后一次性扣减）"
payoff = "到期（事件结束后第 20 交易日）收益 = 名义 × max(0, (K − S_T) / K)，S_T 为到期日收盘"
disclosure = "不模拟时间价值路径与提前行权；仅深慢预案买入；纠错为深慢时在纠正日另买一份，原份持至到期"
sensitivity = "权利金率 1.0% 与 2.0% 作为对冲成本假设的稳健性对照，只报数字、不改主口径"

[reentry]
rule = "事件结束日起 20 个交易日线性回补：仓位从预案值（止损后为 0）线性回升至 100%"
disclosure = "回补触点用事后事件结束日，属反事实记账口径（与套对路径用真型同类的上限性质一致）；实盘需实时解除规则（如 250 日线收复），回测结论是实盘的上限"

# ---------------------------------------------------------------------
# 四、四路径反事实
# ---------------------------------------------------------------------
[paths]
P1_correct = "套对预案：切换时点与最早确认机制一致（第 2 个交易日收盘），用事后真型的预案。上限估计。"
P2_wrong = "套错预案：同时点，故意用反型的预案。下限估计——切错的代价。"
P3_none = "无预案：全程满仓纯持有。基线。"
P4_realtime = "实时分类：as-of 逐日判定 + 连续 2 日确认 + 最多纠错 1 次。真实可达——产品二的成绩单。"
P3b_sensitivity = "基线 + 常规止损 8%：敏感性对照，不进主对比"
timing_note = "切换前（第 0 日至生效前一日）四路径同为满仓纯持有，差异只在切换后显现；路径一是上限（假定分类完美），必须与路径四并排写，不许拿路径一当产品收益"

comparisons = [
  "路径一 − 路径三（有预案 vs 没预案，上限）",
  "路径四 − 路径三（实际可达 vs 没预案）",
  "路径一 − 路径二（用对 vs 用错，切换的价值）",
]

[pnl_accounting]
base = "第 0 天前一交易日收盘（含第 0 日当日收益，四路径同为满仓）"
windows = "事件期间 = [第 −1 日收盘 → 事件结束日收盘]；事后 20 日 = [事件结束日收盘 → 其后 20 交易日收盘]；全程 = [第 −1 日收盘 → 事件结束 + 20 交易日收盘]"
metrics = ["事件期间累计收益", "事后 20 日累计收益", "全程累计收益", "全程最大回撤", "对冲净成本（仅深慢预案）"]
compounding = "V_{t+1} = V_t × (1 + 仓位 × 指数日收益) + 当日对冲现金流；现金流按收盘后计入、不复利"
turnover_friction = "核心层不含换手摩擦（仅仓位乘法与对冲现金流）；防御倾斜增强层的摩擦留待后续版本"
presentation = "逐事件列表呈现；组间只报中位数与四分位，不做组均值显著性宣称（深慢真型 15 个 / 浅快真型 30 个，样本太小）"

# ---------------------------------------------------------------------
# 五、误判代价表
# ---------------------------------------------------------------------
[misjudgment]
true_type = "第八版冻结拓扑分型：状态扩张型（深慢，15 事件）/ 相关重构型（浅快，30 事件）"
judged_type = "路径四首次确认切换所用的预案类型；从未切换 → 无法判定"
confusion = "行 = 真型（深慢/浅快），列 = 判型（深慢/浅快/无法判定）"
theoretical_constants = """
假阴（真深慢判成浅快 → 漏砍仓）代价 = 7.57（第八版深慢型危机段最大回撤中位的绝对值，第九版预登记已冻结）；
假阳（真浅快判成深慢 → 误砍仓）代价 = 6.16（第八版浅快型事后 20 日累计中位的绝对值）；
理论期望代价 = (假阴数 × 7.57 + 假阳数 × 6.16) / n。
"""
baseline_constant = "全判同一类基线：全判浅快 = 真深慢数 × 7.57 / n（测试段 7 × 7.57 / 17 ≈ 3.11）；全判深慢 = 真浅快数 × 6.16 / n（测试段 ≈ 3.62）。两种都报。"
realized_cost = "实际误判代价 = 该事件（路径一全程累计 − 路径四全程累计）的中位数，按混淆矩阵单元格分组；无法判定单元格同样报（错过保护的代价）"

# ---------------------------------------------------------------------
# 六、时间切分与分层披露
# ---------------------------------------------------------------------
[time_split]
cut = "2015-01-01（与第九版同一切点）"
segments = "前段 = 起点 < 2015-01-01（28 事件）；后段 = 起点 ≥ 2015-01-01（17 事件）"
walk_forward_note = "本版无任何全样本拟合参数：投票方向为第十版固化（披露为样本内知识），极端阈值为滚动 3 年历史分位（逐日 as-of），切分仅用于分层披露，不用于选参"

# ---------------------------------------------------------------------
# 七、样本
# ---------------------------------------------------------------------
[sample]
events = "第八版冻结的 45 个统计事件（前段 28 + 后段 17）；外部锚点 18/19 不进入"
true_labels = "regime_v08_typology_event_profiles.csv 的 cluster_k2（1 = 状态扩张型，2 = 相关重构型）"
prices = "regime_v05_benchmark_daily.csv 的真万得全A（881001.WI）收盘与日收益，全 6483 交易日日历"
features = "regime_v07_split_wide.csv（6483×67，已验收）"
open_amount = "crisis_context_v07_event_windows.csv（仅用于价格确认子规则②的开盘与成交额）"
missing_policy = "缺失记空值、不补零不插值；特征窗口有效性按逐日判定规则；价格确认子规则②可用日不足时记不可用"

# ---------------------------------------------------------------------
# 八、输出
# ---------------------------------------------------------------------
[outputs]
prefix = "regime_v011_"
files = [
  "regime_v011_counterfactual_event_pnl.csv",      # 逐事件 × 4 路径损益与对比
  "regime_v011_counterfactual_daily_timeline.csv", # 逐事件逐日判定时间线
  "regime_v011_counterfactual_confusion.csv",      # 混淆矩阵与误判代价
  "regime_v011_trigger_audit.csv",                 # 触发层审计（价格确认/区间检测/拓扑警戒延迟）
  "regime_v011_manifest.json",
]
report = "crisis_counterfactual_v011_report.html（离线单文件中文报告；可见文本零英文缩写；威尔斯特拉斯距离译名固定；工程字段名只放悬停）"

# ---------------------------------------------------------------------
# 九、验收
# ---------------------------------------------------------------------
[acceptance]
double_run = "完整脚本独立运行两次，数据产物字节一致（清单时间戳除外）"
determinism = "本版无随机数、无自助、无置换；全流程确定性"
expected_table = "报告含『危机类型 × 逐日判定是否来得及 × 实际效果』对账表（深慢第 2–3 天切、浅快部分价值、急性崩盘 3 日内来不及）"

# ---------------------------------------------------------------------
# 十、禁止事项（红线）
# ---------------------------------------------------------------------
[prohibitions]
- 不重判十四条推测；不改 config/study.toml 与 v0.5—v0.10 任何冻结产物
- 不反选任何参数：仓位幅度（50%/80%）、止损（20%/12%）、权利金率（1.5%）、投票方向、阈值全部按本预登记执行
- 不读取或评分 2025 年最终测试集；第一道闸门仍暂停，第二道闸门未启动
- 不把本版结果表述为策略收益承诺、样本外预测能力或实盘可达收益；全部为样本内反事实记账，回测结论是实盘的上限
- 路径一是上限（分类完美），不得当产品收益；产品成绩以路径四为准
- 不做组均值显著性宣称；逐事件列表呈现
- 增强层（防御倾斜：低波 5 行业 ×1.5 / 高波 ×0.5）不在本版执行，留待核心层结果之后另版登记

