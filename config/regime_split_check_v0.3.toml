# STAGE 2 AMENDMENT — 2026-11-09
# 登记时点：主判据任何分组统计 / 显著性检验 / 判定结果产生之前。
# 触发：用户指出助手把「标签段长 label_run_days」误当成「行情长度」，
#       因而 v0.2 prior_fill_counts 与「6 个短于 10 日事件填不满窗口」的说法
#       在概念上不成立，不能作为排除样本的依据。
# ============================================================================
[stage2_amendment_2026_11_09]
registered_before_any_main_judgement_result = true
user_decision_raw = "你犯的错是：都把标签段长当成了行情长度。所以我认为你应该只把2016-02-17以及2024-12-12的事件放一边，另外四个照常算。"

# --- 1. 三种长度必须分开（概念修正，非结果修正）-----------------------------
length_definitions = [
  "L1 label_run_days = 连续满足 Y_t=1 的『起点日个数』；只回答『有多少个 t 往后看 20 日能凑够 -10%』，与下跌持续多久无关",
  "L2 crisis_in 日数 = 该段被标为危机中的日级样本数；只决定『危机中』分组有多少行可用于统计",
  "L3 span_to_worst = 起点 -> 未来 20 日窗口内最低点的交易日距离；回答『跌到最深用了多久』，且被 20 日标签窗口截断，不是事件总长度",
  "关键：逐日摘要的回看窗口 w 与事件持续长度是两个独立量。每天都有一张持续图，事件短只减少该状态组的样本行数，不会让 w=10 的摘要『算不出来』，也不需要左截断或可变窗口",
]
voided_statements = [
  "v0.2 [grid].prior_fill_counts = {10:10, 15:6, 20:2, 30:2, 40:0, 60:0}（由 label_run_days >= w 计数）——保留作历史记录，作废，不得再作判据",
  "v0.3 [decision_D3_pending].fact 中『6 个短于 10 日』——同上作废",
  "助手 2026-11-09 上一轮『6 段填不满 10 日窗口 / 尺子比事件长』的图示与文字——作废",
]
