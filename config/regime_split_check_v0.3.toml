# --- 3. 连带技术修正（均为预先发现的结构性事实，非按结果改规则）-------------
[stage2_amendment_2026_11_09.method_corrections]
five_label_versions_triviality = "5 个标签版本只改变 bull/bear/fuzzy 划分，crisis_in / pre5 / pre10 / pre20 / normal 在这 5 版下完全相同。因此『5 版本方向稳定』对危机类主判据是平凡成立（trivially satisfied），不构成独立稳健性证据。本版仍全跑全披露 5 版，但危机类命题的稳健性条件改由『A 线 p16/p27 两面板方向一致 + w=10/20/60 全窗口方向一致』承担；牛熊类命题（C09）才真正受 5 版影响"
b_w30_no_h0 = "B 线 w=30 长尺度对照只有 H1/H2/景观/betti/控制量，没有 H0 摘要（阶段 1 只新算了 w=10 的 H0）。因此 B 线跨窗口对照在 H0 维度上不可比，须单列披露，不得把 w=10 的 H0 结论外推到 w=30"
a_w10_structural = "A 线 w=10 时 10 个点 < 16/27 维，H0 仅 9 个有限 death、H1 受点数-维数比约束，W2 方差放大；只作主判据不做跨窗口绝对量级比较"
b_w10_noise = "B 线 w=10 相关用 W-1=9 个日收益估计，Fisher z 标准误 1/sqrt(9-3)=0.408（w=30 为 1/sqrt(29-3)=0.196）；N/H2 计数漂移须单列"
scale_residual = "A 线形状摘要须另报剥尺度版本：W_t/window_rms、h0_death_mean/window_rms、W_t 对 (window_rms, avg_pair_corr, leading_eig_share) 回归残差；B 线距离本身尺度无关，不套用 A 的残差口径"

# --- 4. 主判据规则（本段冻结后一次性执行）----------------------------------
[stage2_amendment_2026_11_09.primary_rules]
rule = "每条线各预设一个主判据格，不从全网格中挑；两线独立出结论，绝不合并成一句『变好了/没变不好』"
A_line = "A(PHTI 状态点云) w_points=10，p16 与 p27 各一份；state=crisis_in（事件级 14 起点 + 日级 214 日两口径都报）；summary={W_resid, W_over_rms, h0_over_rms, h0_death_cv, h0_top1_over_rest_median, h1_count} 6 格；判『支持』需至少 1 格过 Bonferroni(12) 且 CI 不跨零、且 p16/p27 方向一致；全不显著判『无法判定』，不得判『矛盾』（方向未预设）"
B_line = "B(兴业相关网络) w_coords=10；state=crisis_in 与 pre10 各报；summary 按 H0 层级聚类（xy_h0_death_cv, xy_h0_top1_over_rest_median, xy_h0_components_0p4/0p6/0p8）、H1 无弦环（h1_count, h1_landscape_l1）、H2/N 空腔（h2_count, h2_landscape_l1, max_h2_persistence）分维独立报，禁止跨维合并方向计数；同一显著性与方向一致性标准（B 线单面板，改由 H0/H1/H2 三维内部一致 + w=30 对照承担）"
J1_post_hoc = "事后响应：危机中 vs 常态是否可检出；A/B 各自定义、各自出结论"
