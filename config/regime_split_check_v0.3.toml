three_fill_counts_distinct = [
  "按 L1 >= w: w10=10/16, w15=6/16, w20=2/16, w30=2/16, w40=0/16, w60=0/16",
  "按 L2 >= w: w10=10/16, w15=7/16, w20=3/16, w30=2/16, w40=1/16, w60=0/16（w30 初稿手写为 1/16 系笔误；按 L2=[33,6,1,14,19,14,17,13,15,2,42,6,21,1,1,16] 中 >=30 的有 33 与 42 共 2 个，已按脚本实测更正，登记于 stage2c）",
