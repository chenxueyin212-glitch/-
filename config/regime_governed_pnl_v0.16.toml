# v0.16 预登记：消音治理后的触发器接回端到端损益账本
# 登记时间：2026-11-14T13:49:02+08:00（先登记后计算；登记时未运行任何本版计算）
# 一句话：把 v0.15 选定触发器（三中二·回撤换年线）装上 v0.14 消音规则（撤销＋冷却），
#          再把治理后的警报态接回 v0.12 的四路径损益引擎，算清"误报少了、响得晚了"对钱的净影响。

[meta]
version = "v0.16"
title = "消音治理后的触发器接回端到端损益账本"
registered = "2026-11-14T13:49:02+08:00"
purpose = "样本内描述性反事实记账。回答两问：消音规则装在轻触发器上还灵不灵；接上算钱账本后净值几何。"

# ---------- 底座触发掩码（v0.15 冻结，逐字重建，一字不改）----------
[base_mask]
source = "v0.15 选定行 S3 三中二（回撤换年线）"
rule = "3中2(五日跌四 D2, 波动抬升 V2, 回撤警报 R1)"
signals = """
D2 = 最近 5 个交易日对数收益之和 <= -4%
V2 = 20 日收益波动率 > 滚动 756 日（最少 250 观测）70 分位
R1 = 距 20 日最高收盘回撤 >= 5%
命中 = 三项中至少两项为真（逐日）
"""
frozen_from = "config/regime_lightpatch_v0.15.toml / config/regime_trigger_recall_v0.13.toml（阈值源）"
prohibition = "不得改任何阈值、不得增删元件；本版只在其上装治理层"

# ---------- 治理层（v0.14 冻结状态机，逐字复用）----------
[governance]
source = "v0.14 警报态状态机"
mechanism = """
警报态开合：原始命中则开态（当日计警报）；开态中无命中则进入静默计数；
撤销规则甲（收复静默）：静默满 3 日且近 3 日收盘均在 250 日线上方→撤销；或静默满 5 日→兜底撤销
撤销规则乙（纯静默）：静默满 5 日→撤销
撤销日不计警报日；撤销后进入冷却期（0/5/10/20 交易日），冷却内命中被抑制不重新开态
"""
variants = ["G0", "A0", "A5", "A10", "A20", "B0", "B5", "B10", "B20"]
variant_names = ["原始（无治理）", "收复静默·无冷却", "收复静默·冷却五日", "收复静默·冷却十日", "收复静默·冷却二十日", "纯静默·无冷却", "纯静默·冷却五日", "纯静默·冷却十日", "纯静默·冷却二十日"]
keep_all = "9 变体 + G0 同表保留，无论好坏不删行"

# ---------- 时钟原点（接回 v0.12 账本）----------
[clock]
attribution_window = "[事件起点−20, 事件结束]（与 v0.12 归属窗逐字同）"
origin = "归属窗内治理后警报态的首个警报日 = 第 0 天；损益基 = 第 0 天前一交易日收盘"
damage_window_rule = "识别窗 [−20, 结束+20] 内损伤窗（结束后）才响的事件：无时钟原点，记『来不了及』，四路径差记 0（保护期已过，如实入账）"
state_continuation = "治理后警报态若从窗外延续进窗（窗口打开时已在警戒），窗内首日即第 0 天——与 v0.12 对长青信号的口径同"

# ---------- 判定机与预案引擎（v0.11/v0.12 逐字同，不改一字）----------
[engine]
source = "build_v012_trigger_policy.py 引擎段逐字复用（判定/切换/纠错/仓位/止损/认沽/回补/复利）"
daily_judgment = "基线窗 10 日（非空≥8）、当前窗≥80%、滚动 756 日（最少 120 观测）85/15 分位极端、危机确认分=极端项数/7、类型分=三特征等权投票（尺度均方根>0、平均两两相关>0、相关网络零维死亡值<0 各投深慢）、2/3 与 1/3 阈值、连续 2 日同向确认、危机确认分≥4/7、纠错≤1 次、判定窗第 1–20 日"
switch_eligibility = "确认日偏移 < 事件结束偏移（严格小于，至少留 1 个危机内生效日）"
plans = "深慢预案 50% 仓＋合成虚值认沽（K=0.95×生效日收盘、名义 0.5、权利金 1.5% 一次性、到期收益=名义×max(0,(K−S_T)/K)）＋止损 20%；浅快预案 80% 仓＋止损 12%；基线满仓持有；路径一套对在第 2 日切换（上限），路径二套错，路径三无预案，路径四实时分类；P3b=基线＋8% 常规止损（敏感性）"
stop_and_reentry = "止损自切换日收盘锚定、仅事件期间监测、触发后仓位归零至事件结束；回补=事件结束起 20 交易日线性回升；纠错时新预案止损以纠正日收盘重锚"
compounding = "V_{t+1}=V_t×(1+仓位×日收益)+对冲现金流；全程=第 0 天至事件结束+20 日"

# ---------- 误报段损益（v0.12 账本口径）----------
[false_alarm]
episode = "治理后警报态的连续警报日段；与任何事件归属窗 [−20, 事件结束] 相交者归属事件不计误报"
evaluation = "段首日为第 0 天，判定机 eligibility=False（去掉确认日<事件结束约束），持有代理 20+20 日，算路径四−路径三损益差（带符号）"
net_account = "净账合计 = 事件侧（路径四−路径三）合计 + 误报段损益差合计（带符号相加；负=流失）"
note = "误报归属窗为 [−20, 结束]（账本口径），与 v0.13—v0.15 触发层的 [−20, +20] 略不同；跨版误报日数不可直接比，本版内部自洽"

# ---------- 指标 ----------
[metrics]
primary = "净账合计（事件侧＋误报段）；45 全样本与已触发/已切换子集的路径四−路径三中位；误报日/年、误报段/年"
secondary = "路径一−路径三合计（上限）、路径一−路径二（套对减套错）、识别分档（提前/窗内/损伤窗/漏，识别窗 [−20,+20] 与 v0.13—v0.15 同）、拖延事件清单（治理后首响−原始首响）"

# ---------- 机械选定规则（计算前固定）----------
[selection]
hard_gate = "识别 45/45（识别窗三档口径，漏=0）——沿用『全部识别是最基础的』红线"
rank = "净账合计大 → 误报日/年小 → 冷却日数短"
candidates = "G0 与 9 治理变体全部为候选；若 G0 中选即如实报『消音不省钱，省的是值守体验』"
disclosure = "选定是样本内机械择优，不是样本外证据；全表保留供对照"

# ---------- 对照 ----------
[reference]
v012_rows = "第十二版 乙/丁/戊 三行静态对照（引擎逐字同、仅触发掩码不同，损益可比；绝对值与 v0.11 已知起点口径仍不可跨版比）"
v015_rows = "第十五版 S3 行触发指标（G0 对账）"

# ---------- 验收 ----------
[acceptance]
dual_run = "完整脚本独立运行两次，数据产物字节一致（清单时间戳除外）"
reconcile = "G0 行识别分档与 v0.15 S3 行逐字段一致；G0 归属窗内首响偏移与 v0.15 矩阵 S3 行一致"
guard = "实现护栏：判定基线窗负下标不回绕（起点前不足 10 日取可用历史）；不改变任何规则参数"

# ---------- 红线 ----------
[prohibitions]
- "不反选参数、不按结果增删变体或改阈值"
- "不改 v0.15 掩码、v0.14 状态机、v0.12 引擎的任何规则"
- "2025 最终测试集封存不读"
- "路径一是上限，不得当产品收益；成绩单只认路径四"
- "全部为样本内反事实记账，不外推、不做显著性宣称"
- "报告可见文本零英文缩写；工程字段名只放悬停"

# ---------- 产物 ----------
[outputs]
- "outputs/regime_v016_governed_pnl_summary.csv"
- "outputs/regime_v016_governed_pnl_event_matrix.csv"
- "outputs/regime_v016_governed_pnl_false_alarm.csv"
- "outputs/regime_v016_governed_pnl_manifest.json"
- "outputs/crisis_governed_pnl_v016_report.html"

