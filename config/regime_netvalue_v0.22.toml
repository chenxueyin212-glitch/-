inherited = [
  "全部结论为样本内描述性对账，不外推",
  "不自动改写冻结产品；v0.21 及此前产物不覆盖",
  "判定层逐字冻结：本实验不改 S3、B10、确认票、类型票、判定钟、修正规则",
  "识别≠预测；历史结果为上限口径之一",
]
added = [
  "净值版为机械模拟：指数不可直接交易（无跟踪工具费差）、停牌与流动性冲击未计、认沽为合成简化记账（无市场期权数据，继承 v0.16 口径）",
  "回补B为用户预登记前拍板的主方案，非事后择优；A/B 对照结果无论方向均保留",
  "成本假设（万10/万25/零）为敏感性设计，不做参数搜索",
  "认沽滚动续买为净值版新增规则（事件账仅一期），成本与收益均在连续净值中体现",
  "否定结果同样保留并报告",
]
