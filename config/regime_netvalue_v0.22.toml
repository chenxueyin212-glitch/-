[meta]
version = "v0.22"
name = "净值口径完整核算：连续净值模拟（回补B主方案，含认沽、止损、类型修正）"
registered = "2026-11-19T17:29:04+08:00"
status = "预登记（计算前冻结本文件；运行后不得修改）"
purpose = """
此前所有账本（v0.16/v0.19/v0.21）均为「单位账」：按事件/误报段切片、以事件结束日为已知输入
锚定回补起点、止损终点、认沽到期与切换资格四处，属上限口径。本实验第一次构造全日历连续净值：
（1）彻底去掉「事件结束日」后视锚，仓位解除改用告警驱动（B10 撤销＋冷却）；
（2）把事件账已有的认沽、止损、类型修正三件事移植进连续净值核算；
（3）显式计入交易成本，并给出回补A（固定期限）对照臂。
产出组合层面的年化、波动、Sharpe、最大回撤与分年收益——回答「这条产品链在真实复利口径下
到底改善什么、不改善什么」。
"""

# ---------------------------------------------------------------------
# 一、判定层输入（冻结，不重算、不改写）
# ---------------------------------------------------------------------
[inputs]
judgment = """
切换日序列直接取自 v0.21 双模式冻结产物，仅用方案一（7项4票 F7K4）臂：
- 事件侧：regime_v021_{baseline,rolling}_event_matrix.csv 的 switch_dates_p4 列
  （baseline 22 个切换日=19 首切+3 修正；rolling 27 个=22 首切+5 修正），逐字符解析；
- 误报侧：33 个激活段（judged_type∈{深慢,浅快}）在 v0.21 CSV 中只有段级判定与首确认偏移，
  无切换日期明细；本实验对每个未归属告警极大段以段首为锚重算单钟（clock_judgments 与
  merge_switches 逐字复制自 build_v021_rolling_clock.py，含确认票≥4、两日同型、
  20日钟、修正≤1次全部原样），重算结果必须与 v0.21 CSV 逐行断言一致后才允许进入净值核算。
"""
b10 = """
S3 触发与 B10 状态机（五日简单收益≤−4%／20日波动＞756日70分位／距20日高点回撤≥5%
三中二；五日静默撤销＋十日冷却）逐字复制自 build_v021_rolling_clock.py 重建全日历告警掩码。
重建后对账：每个告警极大段，要么含某事件的 trigger_date（归属事件），要么与
v0.21 false_episodes 逐行同起止（归属误报）；两者必须覆盖全部段。
"""
lookahead = "净值核算不使用事件表、事件结束日、真实类型标签等任何未来信息；只使用当日及以前的行情、特征、告警与判定输出。"

# ---------------------------------------------------------------------
# 二、核算层规则（全部预登记，执行时不得调整）
# ---------------------------------------------------------------------
[rules.positions]
base = 1.0
deep = 0.5
shallow = 0.8
semantics = "切换/修正日收盘决策、次一交易日起生效（与事件账 build_positions 的 pos[t]=旧值语义逐字一致）。"

[rules.rebuy_B]
name = "回补B（告警驱动，主方案）"
definition = """
任何裁仓（切换、修正、止损）后，回补起点 = 裁仓锚日之后最早的交易日 x，满足 x−10 至 x−1
连续十个交易日告警掩码全为 False（即市场已静默满十日＝B10 冷却结束）。自 x 起 20 个交易日
仓位线性回补至 100%。回补进行中出现新的确认切换 → 本轮回补作废，自切换日起按新预案执行。
回补期间的新告警（未确认切换）不中止回补。若回补起点越出数据末端则持有至末尾。
"""

[rules.rebuy_A]
name = "回补A（固定期限，对照臂；继承净值演示口径）"
definition = """
任何裁仓后，回补起点 = 裁仓锚日（最近一次切换/修正/止损日）起第 20 个交易日；自该日起
20 个交易日线性回补至 100%。回补中进行新确认切换 → 作废并按新预案。
"""

[rules.stop]
deep = 0.20
shallow = 0.12
definition = """
自最近切换/修正锚日收盘起，指数收盘相对锚日收盘的累计跌幅 ≤ −20%（深慢预案）或 −12%
（浅快预案）→ 剩余股票仓位清零，止损日次一交易日起生效。止损监测窗口 = 锚日至回补起点前。
止损发生后：同一告警段内后续切换不再执行（与事件账 not stopped 语义一致）；新告警段的新钟
确认切换照常执行（新的一轮动手）；止损后回补触发与切换后一致（B：静默满十日；A：锚日+20）。
"""

[rules.put]
name = "合成虚值认沽（口径继承 v0.16，净值版去前视）"
otm = 0.95
notional_frac = 0.5
premium_rate = 0.015
maturity_days = 20
definition = """
切换或修正为深慢当日（生效日）买入：行权价 K=0.95×生效日收盘，名义=0.5×生效日策略净值，
权利金=1.5%×名义（当日现金流流出）；到期日=生效日＋20 交易日，到期现金流=
名义×max(0, (K−到期日收盘)/K)。到期时若「当前预案仍为深慢、未止损、到期日早于回补起点」
→ 以到期日为新生效日按同规则续买一期（危机持续则逐月滚动）；否则到期结算后不再续买。
持有至到期结算，不提前平仓；认沽买卖不计交易成本与价差（与事件账一致）。
说明：事件账口径认沽到期锚「事件结束＋20 日」（后视）；净值版改为「生效日＋20 日」，
此为去前视的必要改写，逐字登记于此。
"""

[rules.correction]
definition = "切换序列本身携带修正日（v0.21 冻结输出，每段≤1次）。修正日按新预案调仓、重设止损锚、重设回补A锚；修正为深慢则当日按认沽规则买入一期。"

[rules.cost]
base_rate = 0.001
definition = "股票换手成本＝单边费率×|当日仓位变化|×当日策略净值，计入当日现金流。主假设万10（0.10%）；敏感性万25与零成本。基准臂无换手。认沽现金流不计成本。"

[rules.nav]
start = "1999-12-30（数据起点，净值=1）"
daily = "nav[t+1] = (nav[t] + flow[t]) × (1 + pos[t] × ret[t])，flow[t]=当日认沽权利金/到期收益/交易成本合计；ret=万得全A简单收益。"
rf = "Sharpe 取 rf=0，年化因子 250。"

# ---------------------------------------------------------------------
# 三、臂设置（预登记，共9臂；B 为用户在见到任何 v0.22 结果之前拍板的主回补方案）
# ---------------------------------------------------------------------
[arms]
E0 = "基准：全仓持有万得全A，无成本"
A1 = "方案一（固定钟）× 回补B × 全件 × 万10"
A2 = "方案一＋滚动钟 × 回补B × 全件 × 万10 —— 主候选臂"
A3 = "方案一 × 回补A × 全件 × 万10（回补对照）"
A4 = "方案一＋滚动钟 × 回补A × 全件 × 万10（回补对照）"
S1 = "同 A2 但不计认沽（部件归因）"
S2 = "同 A2 但不计止损（部件归因）"
C25 = "同 A2 但成本万25（成本敏感性）"
C0 = "同 A2 但零成本（成本敏感性）"
note = "「全件」＝认沽＋止损＋修正齐备。方案一=7项4票固定判定钟；方案一＋滚动钟=每告警段一钟、确认日时间序合并（v0.21 滚动钟候选 R）。"

# ---------------------------------------------------------------------
# 四、对账与自检断言（任一失败即中止，不得放宽）
# ---------------------------------------------------------------------
[reconciliation]
false_episodes = "误报段重算（两模式各一遍）与 v0.21 false_episodes.csv 逐行断言：episode_start/episode_end/status/judged_type/final_plan_type 逐字符一致；first_confirm_offset 与 corrections 数值一致。"
alarm_segments = "重建的每个告警极大段必须归属（含某事件 trigger_date，或与误报段记录同起止）；归属计数必须覆盖全部段。"
switch_merge = "事件切换日与误报切换日合并为全日历序列：同日重复切换仅允许类型相同（去重）；同日类型冲突即中止。"
double_run = "脚本内部主模拟函数对每臂各跑两遍，净值序列逐日断言全等；脚本本身外部连跑两次，输出 CSV 逐字节一致（记录两次 sha256）。"
anchor_invariants = "无任何裁仓日时仓位恒为 100%；仓位仅在切换/修正/止损/回补事件日变化；认沽仅出现在深慢生效日。"

