[false_and_replay]
note = "误报段按定义即『与全部事件归属窗无交集的告警极大段』，v0.19 中本就一段一钟（锚=段首）；本实验不改其结构。"
invariant = "六臂误报段逐行逐列、验证期重放逐行逐列、识别分档与告警占比，必须与 v0.19 产物完全一致；任何模式下此断言失败即判实现有误。"
correction_of_prior_statement = "2026-11-19 凌晨对话中『滚动重启会让 83 个误报段也获得二次判定机会』的说法在段级规则下不成立，予以更正：误报侧结构不变。"

[arms]
all_six = true
list = ["F7K4(7项4票,冻结方案一)", "F10K4", "F7K5", "F10K5", "F7K6", "F10K6(10项6票,方案二候选)"]

