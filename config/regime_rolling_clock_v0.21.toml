# v0.21 预登记：滚动判定钟（告警段级多钟）候选实验
# 登记时间：2026-11-19T01:08:09+08:00（登记先于一切计算）
# 父版本：v0.19（C1 产品化补全，冻结产物）

[meta]
version = "v0.21"
name = "滚动判定钟：事件级判定环节的告警段级多钟实验"
registered = "2026-11-19T01:08:09+08:00"
purpose = "检验『每个与事件归属窗有交集的告警极大段各自开启一个判定钟』能否在冻结确认票门槛下，解锁此前因单一 20 日判定钟到期而零动作的危机事件，并核算其单位账代价与收益。"
parent = "v0.19"

[change]
scope = "仅 45 事件的事件级判定环节；其余环节（S3 触发、B10 状态机、确认票定义、类型票定义、预案参数、单位账核算、误报段枚举与判定、验证期重放）全部与 v0.19 逐字相同。"
rule = """
1. 对每个事件，枚举与归属窗 [onset-20, event_end] 有交集的全部告警极大段。
2. 每段开启一个 20 交易日判定钟，锚定该段在归属窗内的首日（段一锚点=v0.19 的首个告警日，保持 PnL 窗与识别口径不变）。
3. 各钟独立计类型票：基准窗=锚点前 10 个交易日（随钟滚动）；确认票计数为绝对日口径（不随钟变）。
4. 确认（切换）=钟内第 k>=2 日与前一日同型、该型属于深慢/浅快、该日确认票达标、该日早于事件结束日。
5. 全部钟的确认日按交易日时间序合并：首个确认日切换预案；其后若出现不同型的确认日、距上次切换至少 2 个交易日、修正额度（全局每事件 1 次）未用，则修正预案。同日多钟确认时按锚点先后取先。
6. 其余切换、止损、认沽、回补、损益核算与 v0.19 逐字相同。"""

[design_input]
