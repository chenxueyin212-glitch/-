expected_new_switches_F7K4 = [
  "事件117（2008-01 深慢；钟2 锚 2008-01-17，预计确认 2008-01-23）",
  "事件2（2016-01 深慢；钟2 锚 2016-01-05，预计确认 2016-01-07）",
  "事件12（2022-03 深慢；钟2 锚 2022-03-08，预计确认 2022-03-15）",
]
expected_new_corrections_F7K4 = [
  "事件114（现行浅快；钟2 预计 2006-07-21 确认深慢→修正）",
  "事件119（现行深慢；钟2 预计 2008-08-18 确认浅快→修正）",
]
expected_no_unlock = [
  "事件106/109/111/112/116/124/125/6/8（各钟内均无确认票达标日，段级规则不解锁）",
  "2026 验证期 N2/L2/L3/N3（确认票全窗 0-3，水平型卡死；且重放判定本就按段独立开钟，结构不变）",
