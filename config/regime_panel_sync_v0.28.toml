# v0.28 预登记：分类版本同步（方案 B 优先，失败回退方案 A）
# 背景：产品 a 腿锁定 a16（16 个申万一级行业），2014/2021 两次分类改版后从未同步。
#       a27 特征已算好（2014-03-10 起 3058 日）但未接线；a31 未计算。
#       直接切换会让 756 日滚动分位在断点处混两套坐标，阈值在 2014-02→2017-03、
#       2021-12→2024-12 两段失效；若改为段内重标定并要求 756 日暖机，
#       2015 股灾与 2022 熊市都会落进冷启动空窗。
# 目的：检验「用重叠期把新版本特征单调映射到 a16 的分位刻度」能否在无冷启动的前提下
#       保住历史可比性。通过则采用 B；不通过则回退 A（段内重标定），并按 A 的冷启动规则登记。
# 纪律：先登记后计算；不改 S3、B10、七项确认票的定义、判型、切换核算与论文主结果。

version = "v0.28"
title = "分类版本同步：分位映射优先，段内重标定回退"
registered_at = "2026-11-22T11:56:00+08:00"
status = "preregistered_before_compute"

[scope]
what_changes = "产品 a 腿的特征坐标系与阈值口径（a16 -> a16/a27/a31 分段）"
what_does_not_change = [
  "S3 三条件、B10 静默与冷却、七项确认票的项数与票数门槛、三项类型票、切换状态机",
  "45 个事件标签、冻结标签与掩码、判读禁令",
  "v0.11—v0.22 全部产物：保留不动，不覆盖",
]
outputs_prefix = "regime_v028_"

[panel_versions]
p16 = { codes = 16, usable_from = "2000-01-18", note = "长期连续一级行业，剔除市场表征、二级行业与 2021 版煤炭回填" }
p27 = { codes = 27, usable_from = "2014-03-10", note = "16 + 2014 年可实时使用的 11 个一级行业" }
p31 = { codes = 31, usable_from = "2021-12-13", note = "2021 版一级行业，仅从真实发布日起使用" }
breaks = ["2014-02-21", "2021-12-13"]

[method_B]
name = "经验分位映射（empirical quantile mapping）"
why = """
只依赖秩，不假设线性，天然满足「映射到 a16 的分位刻度」这一目标；
对异常值不敏感，适合拓扑计数这类重尾、离散的特征。
"""
steps = [
  "1. 取重叠期 D_overlap = 新版本可用日 ∩ a16 有值日",
  "2. 对每个特征 f，在 D_overlap 上分别估计 a16_f 与 a27_f 的经验分布 F16、F27",
  "3. 映射 g_f(x) = F16^{-1}(F27(x))，单调、保秩",
  "4. 用 g_f 把 a27（后续 a31 经 a27 中转）的原始值换算成 a16 刻度上的值",
  "5. 之后一律用 a16 的固定阈值（训练期 85/15 分位）判定极端，不再重算阈值",
]
scope_per_feature = """
按特征逐个判定，不要求整体通过。通过的特征走 B，未通过的特征走 A 的段内重标定，
并在 manifest 中逐项列明哪些特征用了哪条路径。
"""

[validation]
protocol = """
重叠期按时间 70/30 划分：前 70% 拟合映射，后 30% 做外推检验（外推段完全不参与拟合）。
外推段是唯一判据，拟合段误差只作诊断，不进门槛。
"""
metrics = [
  "mae_quantile = 映射后分位与 a16 实际分位之差的绝对值均值（分位单位，0—1）",
  "p90_quantile = 同一误差的 90 分位",
  "extreme_agreement = 极端判定的逐日一致率：映射后判定 vs a16 判定，阈值取训练期 85/15 分位",
  "rank_shift = 映射前后该特征在 45 个事件窗内的分位秩偏移中位数",
]

[thresholds]
pass_all = { mae_quantile = 0.05, p90_quantile = 0.12, extreme_agreement = 0.90 }
rule = "三项全部满足才算该特征通过 B；任一项不满足即该特征回退 A"
note = "门槛在计算前固定，不因结果调整；a16 与 a27 相关过低的特征（参考 h1_count 约 0.3）预期不通过"

[fallback_A]
trigger = "任一特征未通过 [thresholds].pass_all"
method = """
段内重标定：
- 每个分类版本段内，用该段自身可用数据的扩张窗口（最小 250 日）计算分位，转成段内百分位
- 段与段之间拼接的是百分位，不是原始值
- 每段前 250 日为冷启动，该期判定标记为 degraded=true，不与正常期混算
"""
declared_cost = """
预计空窗：a27 段 2014-02-21→2015-03（盖住 2015 股灾前段）；
a31 段 2021-12-13→2022-12（盖住 2022 熊市前段）。
若走 A，必须在报告中单列这些事件的降级判定，不得与正常期结果合并叙述。
"""

[stop_rules]
- "重叠期不足 500 个交易日 -> B 不可检验，直接按 A 登记"
- "任一版本的特征在重叠期内可用率 < 90% -> 该版本该特征退出，不强行映射"
- "B 与 A 两条路径下 2026 三段（L1/L2/L3）的票数结论方向相反 -> 停止，先查数据再定，不择一采用"
- "不做任何以「让 2026 票数变多」为目标的参数调整；2026 已被多次读取，只作事后描述"

[red_lines]
- "2026-04-08 之后的数据不得用于拟合任何映射或阈值"
- "fitted_at 与 first_result_at 必须落在同一次运行的两条独立记录里，且 fitted_at 更早"
- "不覆盖 regime_v07_split_wide.csv；新表另存为 regime_v028_split_wide.csv"
- "论文主结果仍用方案一（a16 口径）；v0.28 只作版本敏感性与覆盖度扩展候选写入 5.4"
