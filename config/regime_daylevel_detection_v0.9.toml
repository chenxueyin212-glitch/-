# =====================================================================
# v0.9 预登记：危机拓扑状态的日级检测与实时分类
# =====================================================================
# 登记时间：2026-11-12T21:59:14+08:00（在任何 v0.9 统计计算之前创建）
# 目的：产品二（危机类型条件化预案）的前置研究。回答三个问题：
#   问题一（触发器）：只用当日及以前的拓扑特征，危机邻近日与常态日能否区分？
#   问题二（分类器）：危机起点后第 k 日（k=0..15），只用截至当日的特征，
#                     两类危机（状态扩张型/相关重构型）能否实时区分？判别滞后多长？
#   问题三（功效边界）：有效样本量下，多大的效应才可被检测？
# 本版是检测/分类层研究，不是交易策略、不是绩效回测、不重判十四条推测。

[meta]
version = "v0.9"
title = "危机拓扑状态的日级检测与实时分类"
created = "2026-11-12T21:59:14+08:00"
scripts = "src/regime_check/build_v09_daylevel_detection.py; src/regime_check/build_v09_daylevel_report.py"
data_inputs = [
    "outputs/regime_v07_split_wide.csv",           # 6483×67 日级宽表（v0.7 已验收）
    "outputs/regime_v08_typology_event_profiles.csv", # 45 事件 × 分组标签（v0.8 已冻结）
]
data_outputs_prefix = "regime_v09_ / crisis_daylevel_v09_"
parent_versions = ["v0.5 判定层冻结", "v0.6 早期补算冻结", "v0.7 整合冻结", "v0.8 分型冻结"]

# ---------------------------------------------------------------------
# 一、样本与日历
# ---------------------------------------------------------------------
[sample]
calendar = "v0.7 标签日历 6483 日（1999-12-30..2026-11-03）"
events = "v0.8 的 45 个统计事件（28 前段 + 17 后段）；外部锚点 18/19 不参与本版任何检验"
event_onset = "危机开始参照日（事后认定口径，2026-11-10 拍板 + 11-11 时序修订）"
cluster_labels = "v0.8 冻结的两类：状态扩张型（数据中「状态.window_rms升型」，15 事件）/ 相关重构型（数据中「相关.xy_h0_death_mean升型」，30 事件）"
cluster_label_note = "分组标签是全样本聚类产物；问题二的时间切分只约束分类器参数，不宣称完全样本外（在报告中如实披露）"

# ---------------------------------------------------------------------
# 二、特征白名单（只测以下 11 项，与 v0.8 事件级 delta 完全同源）
# ---------------------------------------------------------------------
[features]
daily = [
    "a16_W_t",                      # 状态点云相邻日持续图距离
    "a16_h0_death_mean",            # 状态点云零维死亡值均值
    "a16_h1_count",                 # 状态点云一维环数量
    "a16_window_rms",               # 状态点云窗口均方根
    "a16_avg_pair_corr",            # 状态点云平均两两相关
    "a16_leading_eig_share",        # 状态点云第一特征值占比
    "b_h2_count",                   # 相关网络二维空腔数量
    "b_h1_count",                   # 相关网络一维环数量
    "b_h2_landscape_l1",            # 相关网络二维景观范数
    "b_industry_average_correlation", # 相关网络平均相关
    "b_xy_h0_death_mean",           # 相关网络零维死亡值均值
]
whitelist_note = "比较对白名单：11 特征。不在白名单内的任何组合只可标为探索性，不进报告结论表。"
missing_policy = "缺失记空值、逐特征成对剔除；不补零、不回填、不插值。a27_ 全部排除（前段空）。"

# ---------------------------------------------------------------------
# 三、问题一：触发器（危机邻近日 vs 常态日）
# ---------------------------------------------------------------------
[q1_trigger]
proximate_window = "每个事件起点前第 10 至第 1 个交易日（rel ∈ [-10,-1]），主窗口"
sensitivity_window = "rel ∈ [-20,-11]，仅描述性敏感对照，不进主结论"
normal_days = "同时满足：①危机段标记 crisis_in=0 ②不在任何事件 [起点-20, 起点+30] 范围内"
statistics = ["曼-惠特尼曲线下面积", "中位数差", "均值差"]
uncertainty = "分组自助：邻近日按事件整簇重抽（45 簇），常态日按 20 交易日块重抽；B=2000；随机种子 20261112"
primary_tests = "11 特征 × 1 主窗口 = 11 个主检验；曲线下面积单侧大于 0.5 视为方向性区分"
decision_rule = "曲线下面积 ≥ 0.60 且自助 95% 区间下界 > 0.50 → 判『有触发器区分度』；否则判『无区分度』"

# ---------------------------------------------------------------------
# 四、问题二：实时分类（两类危机）与判别滞后曲线
# ---------------------------------------------------------------------
[q2_classifier]
asof_feature_definition = "d(k) = mean(特征[起点 .. 起点+k]) − mean(特征[起点-10 .. 起点-1])；只用起点+k 当日及以前数据"
k_grid = "k = 0..15（起点当日到其后第 15 个交易日）"
primary_k = 5   # 预登记主判定日：起点后第 5 个交易日（中期决策点）；k 曲线整体为描述性
baseline_completeness = "基线窗 10 日中非空 ≥ 8；当前窗 k+1 日中非空 ≥ ceil(0.8*(k+1))"
time_split = "训练段：起点 < 2015-01-01；测试段：起点 ≥ 2015-01-01。阈值只在训练段选（约登指数），测试段只评一次"
primary_tests = "11 特征 × 1 个主 k（k=5）= 11 个主检验；k=0..15 全曲线为描述性判别滞后图"
metrics = ["曲线下面积（各 k）", "测试段混淆矩阵（k=5）", "误判代价表（k=5）"]
cost_matrix = """
  代价常数取自 v0.8 冻结金融画像中位数（只读，不重算）：
  假阴（状态扩张型误判为相关重构型 → 没降仓，承受深回撤）：
      代价 = |状态扩张型危机段最大回撤中位数| ≈ 7.57
  假阳（相关重构型误判为状态扩张型 → 过度降仓，踏空事后修复）：
      代价 = |相关重构型事后 20 日累计中位数| ≈ 6.16
  代价单位为百分点收益；报告期望代价 = (FN×7.57 + FP×6.16)/n_test
"""
decision_rule = "k=5 主检验曲线下面积 ≥ 0.70 且测试段期望代价 < 全判同一类的常数基线 → 判『有实时分类价值』；否则判无"

# ---------------------------------------------------------------------
# 五、问题三：功效边界
# ---------------------------------------------------------------------
[q3_power]
effective_n = "按 20 交易日块估计自相关修正后的有效样本量（邻近日、常态日、事件级三个层面）"
mde = "双侧 α=0.05/11（主检验族邦费罗尼），功效 80% 下的最小可检测标准化效应（Cohen d）与曲线下面积换算"
purpose = "把『没测到』翻译成『测不到』或『真没有』；不做任何正向宣称的替代依据"

# ---------------------------------------------------------------------
# 六、确定性与验收
# ---------------------------------------------------------------------
[acceptance]
double_run = "完整脚本独立运行两次，数据产物字节一致（清单时间戳除外）"
random_seed = 20261112
bootstrap_B = 2000
block_length = 20
report = "离线单文件中文报告；可见文本零英文缩写（正式名称与悬停字段名除外）；威尔斯特拉斯距离译名固定"

# ---------------------------------------------------------------------
# 七、禁止事项（红线）
# ---------------------------------------------------------------------
[prohibitions]
- 不重判十四条推测；不改 v0.5/v0.6/v0.7/v0.8 任何冻结产物与 config/study.toml
- 不做绩效、夏普比率、信息系数、精确率召回率曲线下面积、仓位与阈值反选
- 不读取或评分 2025 年最终测试集；第一道闸门仍暂停，第二道闸门未启动
- 不把本版结果表述为策略收益、预警绩效或样本外预测能力；全部为样本内描述性对账
- 不用 k 曲线事后挑最优 k 再宣称主结论（主 k 预登记为 5）
- 问题二的两类标签来自全样本聚类，报告必须披露该污染并称其为『参数内检验』而非样本外验证

# ---------------------------------------------------------------------
# 追加修订区（只追加，不回改上文）
# ---------------------------------------------------------------------
[amendment_2026_11_12_q1_two_sided]
time = "2026-11-12T22:02:00+08:00"
before_computation = true
note = "问题一原判据写的是『曲线下面积单侧大于 0.5』，会漏掉『危机前显著下降』型特征。更正为双侧：AUC* = max(AUC, 1−AUC) ≥ 0.60 且自助 95% 区间不覆盖 0.50，同时报告方向（升/降）。主检验数量不变，仍为 11。"

[amendment_2026_11_12_polarity_exploratory]
time = "2026-11-12T22:20:00+08:00"
before_computation = false
status = "探索性补充分析，非预登记主结论"
note = "预登记的问题二阈值规则未写极性处理；实测四个相关网络特征在 k=5 的判别方向与命名极性相反（低值→状态扩张型）。补做极性感知版本（训练段极性决定阈值方向）作为探索性披露。预登记主结论仍按原规则报告（2/11 通过）；极性感知版本结果（6/11 代价优于基线）只作参考，不升级为主结论。另注：预登记曲线下面积按全部 45 事件合并计算，探索表中的曲线下面积为 2015 年后 17 个测试事件单独计算，两者不可直接对比。"

