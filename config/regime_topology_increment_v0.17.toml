# v0.17 预登记：产品栈条件下的拓扑条件增量检验（日级重估）
# 登记时间：2026-11-14T21:52:26+08:00（先登记后计算；登记时未运行任何本版计算）
# 一句话：用产品级标准（v0.15 触发器 + v0.14 消音 + v0.12 判定机/账本）重做 v0.9 的日级问题——
#          警报态拉响之后，11 个拓扑特征还有没有增量？据此裁决「拓扑以增强件进产品」还是「定性为科研发现层」。
# 背景：v0.9 是「光着测」的（邻近日对常态日裸区分度）；产品栈触发器三元件全是价量，
#        判定机票箱里的 7 项恰好是 v0.9 有区分度的 7 个拓扑特征，3 个弱件（状态点云相邻日持续图距离、
#        状态点云零维死亡值均值、状态点云一维环数量）没进箱。悬而未决的问题是条件增量。

[meta]
version = "v0.17"
title = "产品栈条件下的拓扑条件增量检验"
registered = "2026-11-14T21:52:26+08:00"
purpose = "样本内描述性判别检验 + 反事实记账。两问：警报态条件下拓扑还分不分得出真假警报（条件判别）；把拓扑装进产品栈两处入口（票箱扩容 / 消音层平静撤销）净账增不增（账本增量）。"
parent_versions = ["v0.8 分型冻结", "v0.9 日级检测冻结", "v0.12 引擎冻结", "v0.14 消音冻结", "v0.15 触发器冻结", "v0.16 账本冻结"]

# ---------- 底座（逐字复用，一字不改）----------
[base_stack]
trigger = "v0.15 选定行 S3 三中二（回撤换年线）：3中2(五日跌四 D2, 波动抬升 V2, 回撤警报 R1)；阈值源 v0.13"
muting = "v0.14 选定行 纯静默·冷却十日（B10）：开态中无命中则静默计数，静默满 5 日撤销，撤销后冷却 10 交易日"
engine = "v0.12 引擎段逐字复用（判定/切换/纠错/预案/仓位/止损/认沽/回补/复利/误报段）"
control_arm = "控制臂 C0 = 上述三件合体，即 v0.16 选定组合，净账须与 v0.16 冻结汇总行逐字段对上"
prohibition = "不改 v0.15 掩码、v0.14 状态机主规则、v0.12 引擎任何参数；实验臂只在下方两处预登记入口动手"

# ---------- 判定机票箱（冻结，用于层一基线与实验臂甲）----------
[vote_box]
crisis_features_7 = """
a16_avg_pair_corr(+1), a16_leading_eig_share(+1), b_industry_average_correlation(+1),
b_h2_count(-1), b_h1_count(-1), b_h2_landscape_l1(-1), b_xy_h0_death_mean(-1)
极端计数 = 当日 7 项各自相对滚动 756 日（最少 120 观测）85/15 分位的极端旗标之和
危机确认分 = 极端计数 / 有效项数；阈值 4/7；判定窗第 1–20 日、连续 2 日同向确认、纠错 ≤ 1 次
"""
type_features_3 = "a16_window_rms(+1), a16_avg_pair_corr(+1), b_xy_h0_death_mean(-1)；三特征等权投票，2/3 与 1/3 阈值（本版不改）"
box_score_for_layer1 = "层一基线分＝危机确认分（当日 7 项极端计数/7）；类型分只存在于判定窗、缺失过多，不进层一基线"

# =====================================================================
# 层一：判别层（条件 AUC 与增量 AUC）
# =====================================================================
[layer1]
question = "警报态已经由 S3 拉响之后，拓扑特征能不能区分真假警报？在票箱分之上还有没有增量？"

# ---------- 样本 ----------
[layer1.sample]
alarm_mask = "控制臂 C0 治理后警报态（S3+纯静默·冷却十日）为真的日子"
primary_positive = "真警报早期日：警报日 d 落入任一事件早期决策窗 [起点−20, 起点+5]；同一日命中多事件窗时归属起点最早者（确定性规则）"
primary_negative = "假警报日：控制臂误报段内的警报日；误报段定义与 v0.16 逐字同——连续警报日段与任何归属窗 [起点−20, 事件结束] 不相交"
excluded_from_primary = "警报日属于归属窗相交段但在早期决策窗之外（危机深处/损伤段）——不进主对比，只报描述性中位数（防平凡分离）"
cluster_positive = "事件整簇（只含至少 1 个真警报早期日的事件）"
cluster_negative = "误报段整簇"
secondary_contrast = "真警报早期日 对 常态日（桥接老标准）"
normal_days = "v0.9 常态日定义逐字：crisis_in=0 且不在任何事件 [起点−20, 起点+31) 排除窗内"
bare_reference = "老标准参照对比，v0.9 问题一逐字重算：危机邻近日 rel∈[−10,−1]（各事件并集去重）对 常态日；点估计须与冻结件 regime_v09_q1_trigger.csv 对上"

# ---------- 特征与方向 ----------
[layer1.features]
whitelist = "v0.9 冻结的 11 项拓扑特征，一个不加一个不减"
frozen_directions = """
方向冻结于 v0.9 记录（provenance＝前版冻结发现，非本轮反选）：
状态点云相邻日持续图距离 升；状态点云零维死亡值均值 升；状态点云一维环数量 降；
状态点云窗口均方根 升；状态点云平均两两相关 升；状态点云第一特征值占比 升；
相关网络二维空腔数量 降；相关网络一维环数量 降；相关网络二维景观范数 降；
相关网络平均相关 升；相关网络零维死亡值均值 降
"""
missing_policy = "缺失成对剔除、不补零不插值；与 v0.9 同"

# ---------- 统计量 ----------
[layer1.stats]
auc = "曼-惠特尼曲线下面积 P(正>负)（平局减半）；与 v0.9 同一实现"
oriented = "定向面积＝按冻结方向取向后的面积；分离强度面积＝max(面积, 1−面积)（v0.9 式，主判定用）"
delta_auc = """
增量面积 = 合并分面积 − 票箱分面积；
合并分 = 标准化(票箱分) + 标准化(特征按冻结方向取向)（等权，样本内均值标准差；标准化在每个重抽内重算）；
正值＝该特征在票箱分之上还带来分离增量
"""
descriptives = "中位数差、均值差（正类减负类）；另报方向与老标准一致性（一致/相反）"

# ---------- 不确定性与多重比较 ----------
[layer1.uncertainty]
bootstrap = "分组自助 B=2000；主对比：正类按事件整簇重抽、负类按误报段整簇重抽；常态日按 20 交易日块重抽（v0.9 同）；随机种子 20261114"
ci = "百分位 95% 区间"
p_values = "自助两尾概率：定向面积对 0.5、增量面积对 0（两倍小尾）"
multiplicity = "主对比 11 特征 ×（定向面积、增量面积）报 BH-FDR 校正标注（q<0.10）；主判定仍用下方双阈值规则，与 v0.9 可比，两者并排披露不互相替代"

# ---------- 判定规则（计算前固定）----------
[layer1.decision]
cond_discrimination = "分离强度面积 ≥ 0.60 且自助 95% 区间不覆盖 0.50 → 判『条件判别成立』（与 v0.9 双阈值同）"
increment = "增量面积自助 95% 区间下界 > 0 → 判『票箱之上有增量』"
old_standard = "老标准高低估判读：11 特征分离强度面积的条件均值 与 裸均值 并排报出差值（描述性，不设显著门槛）"
mapping = """
条件判别成立 ≥1 且增量成立 ≥1 → 拓扑有产品侧增量，走增强件候选；
条件判别成立 ≥1 但增量全无 → 拓扑看得出真假警报但已被票箱吸收，留科研发现层；
条件判别全无 → 拓扑在警报态条件下无判别信息，正式定性科研发现层，不进管线
"""

# =====================================================================
# 层二：账本层（净账增量，三臂同表）
# =====================================================================
[layer2]
question = "把拓扑装进产品栈两处入口，净账变不变？"
arms = ["C0 控制臂（冻结合体，对账用）", "C1 实验臂甲（票箱扩容）", "C2 实验臂乙（拓扑平静撤销）"]
keep_all = "三臂同表保留，不做臂间择优宣称；两实验臂机制不同，各自独立与控制臂比"

[layer2.arm_C0]
mechanism = "v0.16 选定组合逐字复用，净账对账值 = 冻结汇总行纯静默·冷却十日（净账 78.958744、事件侧 147.556072、误报段 −68.597328、识别 45、提前 24、切换 19）"

[layer2.arm_C1]
mechanism = """
票箱扩容（进判定机票箱入口）：危机确认分由 7 项扩到 10 项——
新增 3 件＝状态点云相邻日持续图距离(+1)、状态点云零维死亡值均值(+1)、状态点云一维环数量(−1)，
方向冻结于 v0.9 记录；分数定义不变＝极端计数/有效项数；阈值 4/7 不变；
类型分、触发掩码、消音、预案、账本其余全部不动
"""
known_caveat = "披露：阈值 4/7 在 10 件下的整数门槛由 4/7 变 6/10，比 7 件版更严；本臂检验的是『扩容＋同分位阈值』这个自然实现的打包效果，不能拆开归因给『加特征』单独一项"

[layer2.arm_C2]
mechanism = """
拓扑平静撤销（进消音层入口）：在纯静默·冷却十日（乙）基础上加一条撤销规则丙——
开态中静默满 3 日且当日危机极端计数（冻结 7 件口径）= 0 → 提前撤销（价量平静＋拓扑平静双重平静）；
静默满 5 日兜底撤销与冷却十日不变；其余逐字同控制臂
"""
fixed_numbers = "3 日、计数 0、冷却 10 日均为机制推理预固定，不做网格、不反选"

# ---------- 硬闸与推荐规则（计算前固定）----------
[layer2.gate]
