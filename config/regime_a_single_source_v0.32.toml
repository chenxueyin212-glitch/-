# v0.32 · a 腿单一数据源（31 个申万一级行业全部取 Wind）
# 预登记时间：2026-11-22 13:52（**早于本轮 16 个代码的任何取数**）
# 性质：数据源治理（不是新假设、不是策略评估、不产生新绩效主张）
#
# 为什么必须做：
#   v0.30 只回溯了 15 个 2014/2021 版新代码，p16 的 16 个坐标仍取自本地
#   tdx_central.db/sw_industry_daily。于是 regime_v030_phti_p31_w10.csv 是
#   **混源面板**（16 本地 + 15 Wind）。点云是一个整体距离矩阵，坐标来自两套
#   编制口径/两套清洗流程，采样即不严谨，不可作为「统一坐标」结论的基础。
#   本版把 31 个坐标全部统一到 Wind 单一源，使「同一张点云只有一个来源」。
#
# 与既有结论的关系：
#   - 不改 v0.19—v0.22 任何产物；主结果仍用方案一（7 项 4 票、45/45、+79.0）。
#   - 不改 v0.30/v0.31 已写出的文件；本版产物另立文件名（v032 前缀）。
#   - 2026 不是样本外，只作事后描述。

[protocol]
version = "v0.32-2026-11-22"
status = "preregistered_before_fetching_old16"
prior = ["v0.30 (回溯 15 个新代码，准入通过，但未处理 16 个老代码 → 混源)",
         "v0.31 (a31 判定机调参，网格 66 组合，天花板 6/9)"]
hard_requirement = """
用户明确要求：a 腿换库不可商量，第一步采样必须严谨。
因此本版的判定权在「必须单一源」，不在「结果是否更好看」。
无论 16 个老代码的准入结果如何，产物一律只用 Wind 单一源；
若老代码与本地差异大，则如实记录「a 腿全历史被改写」，并重跑对账，不回退本地源。
"""

stopping_rules = [
  "任一 old16 代码取数失败（行数 <6000）→ 该代码记录缺数，不用本地替代，产物标 partial",
  "全部 31 个代码均无 Wind 序列 → 结论写「单一源不可得」，本版作废",
  "无论准入结果，禁止回退到混源面板作为最终交付",
  "禁止调 window / 分位 / 票数 / 极值阈值以追正",
  "禁止把 2026 当样本外",
]

prohibitions = [
  "不得覆盖 v0.30/v0.31 产物文件名",
  "不得用本版结果替换论文主结果（45/45、24/7/14、31/45、19/45、23.4%、+79.0），除非用户另行拍板",
  "不得因「换源后变差」而保留本地 16 个坐标",
]

[data]
source = "Wind 申万一级行业指数（.SI），wind-finance MCP get_index_kline，period=10 日 K"
old16 = ["801010", "801030", "801040", "801050", "801080", "801110",
         "801120", "801130", "801140", "801150", "801160", "801170",
         "801180", "801200", "801210", "801230"]
new15 = ["801710", "801720", "801730", "801740", "801750", "801760", "801770",
         "801780", "801790", "801880", "801890", "801950", "801960", "801970", "801980"]
codes = ["801010", "801030", "801040", "801050", "801080", "801110",
         "801120", "801130", "801140", "801150", "801160", "801170",
         "801180", "801200", "801210", "801230",
         "801710", "801720", "801730", "801740", "801750", "801760", "801770",
         "801780", "801790", "801880", "801890", "801950", "801960", "801970", "801980"]
codes_note = "p31 全 31 个，等于 old16 与 new15 的并集，全部取 Wind"
begin = "1999-12-30"
end = "2026-11-03"
# 本地库现状（本版不修改，只作比对基准）：
#   old16 覆盖 1999-12-30 → 2026-11-03，各 6484 行
#   new15 覆盖 2014-02-21 / 2021-12-13 起（见 v0.30）
out_db = "a_share_pit/sw_industry_wind_backfill.db"   # 追加，不新建库
out_table = "sw_industry_daily_wind"
raw_dir = "tda_project/outputs/v032_wind_raw"
fill_row_rule = "drop rows where OPEN==HIGH==LOW==MATCH or VOLUME empty（沿用 v0.29 实测坑）"

[admission_gate]
# 判据与 v0.30 amendment_1 完全一致，不因对象变老代码而放宽
criterion = "重叠期日对数收益最大绝对差 ≤ 1e-3"
level_check_role = "旁证：水平比中位 ∈ [0.9999, 1.0001]；因 Wind 与本地基期可能不同，不作为否决项"
min_overlap_days = 200
fail_policy = """
单个代码超差 → 该代码记录 ret_maxdiff 与水平比，**仍然采用 Wind 序列**（单一源优先），
并把该代码标 flag=local_or_version_divergence。不退出、不中止、不回退本地源。
"""
rationale = "拓扑输入是日对数收益；水平基期无关，但收益必须同一条序列，否则即混源"

[panel]
key = "p31_single_source"
n_industries = 31
window = 10
input = "daily_log_return"
metric = "euclidean"
complex_type = "Vietoris-Rips"
maxdim = 1
coeff = 2
wasserstein_order = 2
internal_norm = "L_inf"
voted_features = ["avg_pair_corr", "leading_eig_share", "W_t", "h0_death_mean", "h1_count"]

[self_check]
# 强自检（只在 old16 准入通过时才有意义）：
# 用 Wind 单源重建 p16（start=2005-01-04），必须逐值复现 regime_v03_phti_p16_w10.csv
ref = "regime_v03_phti_p16_w10.csv"
tol = 1e-10
on_fail = "记录 implementation_or_source_divergence，改为对本地 p16 做特征级对账（相关/极端一致率），不中止"

[comparison]
# 判定层：直接沿用 v0.19 冻结参数（F7K4 / F10K6），以及 v0.31 网格
vote_features_7 = 7
vote_features_10 = 10
extreme_pct = 0.85
hist_window = 756
hist_min_obs = 120
pre_window = 20
post_window = 20
primary = "affected9_switched（9 个受影响事件在冻结档下是否仍能切换）"
secondary = "affected9_type_correct；45 事件净账；2026 三窗最高票数"
report_items = ["16 个老代码准入表（ret_maxdiff / 水平比 / 起止 / 行数）",
                "单一源 p16 与本地 p16 的特征相关与极端一致率",
                "单一源 a31 与 v0.30 混源 a31 的特征差",
                "F7K4 与 F10K6 的 45 事件净账、误报、识别",
                "9 个受影响事件的切换日与判型"]
# ---------------------------------------------------------------------------
# 执行记录 amendment_1（2026-11-22 14:05，计算完成后追加，不改任何判据）
# ---------------------------------------------------------------------------
[amendment_1.execution]
old16_fetched = 16
old16_passed_strict = 16
old16_max_ret_maxdiff = 8.374601513416735e-05
old16_level_ratio_med = 1.0          # 恒 1.000000，说明本地与 Wind 是同一条序列
db_codes_total = 31
db_rows_total = 201524
single_source = true                 # source 字段全为 wind / wind|local_defect_2014_2015

[amendment_1.sampling_audit]
audit_file = "tda_project/outputs/regime_v032_sampling_audit.json"
coord_complete = "31/31，无重复无遗漏，等于申万一级 2021 版全集"
gap_per_code = "0（逐代码相对基准日历无缺口）"
align_days = 6500                    # 31 坐标同时有值的收盘日
align_lost = "1 天：2014-02-20（7 个 2014 版新设行业 801740/750/760/770/790/880/890 当日无值）"
align_lost_handling = "丢弃该日，W=10 点云窗口跨日；已在产物标注，不插值、不前向填充"
bench_calendar_gap = """
另发现（不属 a 腿，属 S3/账本腿）：regime_v05_benchmark_daily.csv 缺 19 个交易日，
这些日 Wind 881001.WI 有值、且个股库有成交（已核 2015-07-15 等），判定为本地文件缺口：
2015-07-15, 2015-09-02, 2015-11-27, 2016-04-18, 2016-04-19, 2016-07-04, 2017-04-05,
2017-07-21, 2021-08-06, 2021-10-08, 2021-10-22, 2022-03-03, 2022-03-23, 2022-03-31,
2022-04-14, 2022-05-05, 2022-05-09, 2023-09-08, 2026-10-15
影响：S3 的 5 日收益和在跨缺口日时跨 6—7 日；账本缺 19 个可交易日；七票在 wide 面板少 19 行。
不修，因为修改会动到冻结主结果（45/45、24/7/14、31/45、19/45、23.4%、+79.0），须单独立版并由用户拍板。
"""
turnover_share_check = """
尝试用「31 行业成交额合计 / 全市场成交额」验证互斥完备性，结论为**不可用**：
本地 equity_daily_raw 的个股覆盖不全（2015 年日均 2157 只，实际约 2800 只），
分母偏小使合计份额虚高（2015 年 105.8%、2026 年 99.3%），不能据此判断行业是否重叠。
互斥完备性改以分类体系事实陈述（申万一级对全部 A 股互斥完备划分），不以份额作证。
"""

