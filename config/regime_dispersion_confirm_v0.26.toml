# v0.26 预登记：非拓扑的「分户型下跌」确认通道
# 目的：S3 已经能提前 11—13 个交易日报警，但七项确认票在 2026 L2/L3 上最多 3 票、从未达到 4 票。
#       本实验检验：一条不依赖共动的确认通道，能否在 S3 触发之后识别「分户型」下跌。
# 纪律：先登记后计算；不改 S3、B10、七项确认票、判型、切换核算与论文结论。

version = "v0.26"
title = "分户型下跌的非拓扑确认通道"
registered_at = "2026-11-22T10:58:02+08:00"
status = "preregistered_before_compute"

[sample]
training_end = "2025-04-07"
events_training = 31            # 标签段，onset <= 2025-04-07
rounds_training = 9
sealed = ">2025-04-08 只做冻结后案例投影，不参与任何参数、阈值或方向的选择"
benchmark = "801003 申万A指（与 v0.25、ret250 同源）"
industry_panel = "19 个申万一级行业（与 effective_dimension.py 同源，覆盖率 >= 98%）"

[indicator]
primary = "DISP_z"
definition = """
xs20_t  = 19 个行业过去 20 个交易日累计收益的极差 (max - min)
corr20_t = 同一 20 日窗口内 19 个行业两两相关系数的均值（去对角）
DISP_t  = z(xs20_t) - z(corr20_t)
z 的均值与标准差只取训练期 2005-01-01..2025-04-07 全样本，之后固定不再更新
"""
why = """
两轨型的两个必要特征同时出现：行业之间收益被拉开（xs20 高）、行业之间相关下降（corr20 低）。
合成为一个分数，避免「多指标里挑一个最好看」。
"""
direction = "DISP_z 越高 = 越像分户型下跌；预期与 TWO_TRACK 正相关"
lookahead = "所有分量只用 t 及之前的数据；z 用训练期固定值"
exploratory = [
  "hhi_amt20 = 19 行业成交额（amount）份额的 HHI，20 日均值",
  "breadth_lvl = 收盘价在 20 日均线之上的个股占比（regime_breadth_daily.n_above20_all / n_valid20）",
  "amt_pct250 = 成交额 250 日分位（regime_daily_labels.C1_amount_pct250）",
  "pr20 = 19 行业相关矩阵的参与比（有效维度）",
]

[target]
name = "TWO_TRACK"
definition = """
段内市场（801003）自 onset 起的最低累计收益 <= -10%
且 段内 19 行业平均日度相关 < 0.60
"""
note = """
0.60 取自已记录的三段读数（L2 0.52 / L3 0.45 / N1 0.79），是事前写下的常数，
不是从本次样本里扫描出来的。允许的敏感性检验：0.55 与 0.65，两档同时报告，不择优。
"""

[tests]
T1 = "主检验：31 段训练期，TWO_TRACK(n=?) vs 其余，取 onset 前一交易日的 DISP_z，报 AUC 与 Mann-Whitney p"
T2 = "增量检验：在重建的 S3 告警日集合上，DISP_z >= +1.0 的日子其后 40 个交易日内出现 TWO_TRACK 事件起点的比例，对比全训练期基线；同报误报率"
T3 = "稳健性：留一轮危机（9 轮）后方向是否一致；若某单轮主导则整体降为描述性"
T4 = "案例投影（冻结后只读）：2026 L2（06-18）与 L3（09-09）在 onset 前一日与 S3 首警日的 DISP_z 及分位"

[s3_reconstruction]
rule = "三中二：5 日简单收益和 <= -4%；20 日已实现波动 > 过去 756 日 70 分位；距 20 日高点回撤 >= 5%"
validation = "必须先复现已知首警日：L2 = 2026-06-01、L3 = 2026-08-24；不一致则本实验停止，不进入 T2"

[gate]
pass = "T1 AUC >= 0.70 且 p < 0.05；T2 命中率至少为基线 1.5 倍；T3 无单轮主导"
conditional = "仅 T1 过线：记为描述性判别，不升级为确认通道"
negative = "不满足则记否定结果并封存，不进入产品、不改论文"

[boundary]
- "训练期选参、2026 只投影"
- "行业指数分辨率；不声称识别个股抱团或机构持仓抱团"
- "S3 为重建版，须先与两个已知首警日核对"
- "即使通过，也只是确认通道候选，不是触发器、不是买卖信号"
