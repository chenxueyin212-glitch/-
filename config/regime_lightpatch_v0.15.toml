# =====================================================================
# 预登记：v0.15 弱三中二最小补丁研究（先登记后计算）
# 登记时间：2026-11-14T13:11:09+08:00
# 登记于任何计算之前。本文只追加、不回改；更正进追加修订区。
# ---------------------------------------------------------------------
# 背景与目标（用户 2026-11-14 指令）
#   v0.13 全词表并联（实用候选）45/45 但警戒占历史 50%；弱三中二 44/45、
#   警戒仅 21.1%——只漏 126 号。用户指令：弱三中二不错，顺着这个优化优化。
#   → 本版在【冻结的弱三中二底座】上做【最小补丁】：用最小的警戒代价补上
#     126 号盲区，主指标 = 识别 45/45 的前提下警戒占比最小。
#   盲区诊断（描述性、先于本登记，只用于网格设计、不用于调阈值）：
#     126 号 = 2010-11-08 起 4 日急性事件、顶部反转、事后 20 日 −10.0%。
#     识别窗内弱三中二三要素零共现（计数最大 1）；崩盘在事件结束后才来；
#     窗内提前响的只有顶部预警类（顶部警觉 −17 日、顶部首裂 −8 日）。
#   网格按机制类别全覆盖设计（三家族），不是按 126 号反拟合：
#   全部可加信号 × 两种接法同表保留、无论好坏不删；阈值一个不动。
# =====================================================================

[meta]
version = "v0.15"
title = "弱三中二最小补丁研究"
created = "2026-11-14T13:11:09+08:00"
purpose = "在识别 45/45 的硬要求下，给弱三中二底座找警戒占比最小的补丁；34 行政策同表保留。"
discipline = "先登记后计算；15 信号阈值冻结不动；网格机制驱动全覆盖、不按事件结果删改；无随机数、无参数反选。"

# ---------------------------------------------------------------------
# 一、底座与词表（冻结，一字不改）
# ---------------------------------------------------------------------
[base]
policy = "弱三中二 = 3中2(五日跌四, 波动抬升, 半年线下)——v0.13 原样，一票不改。"
lexicon = "15 信号、阈值、756 日分位窗、最少观测数全部沿用 v0.13 冻结值。"
sample = "45 个冻结统计事件（前段 28：101—128；后段 17：1—17），起止沿用 v0.12 触发表。"
calendar = "regime_v07_split_wide.csv 全日历 6483 个交易日。"

# ---------------------------------------------------------------------
# 二、识别窗与误报（与 v0.13 逐字同口径）
# ---------------------------------------------------------------------
[identification_window]
pre = "起点前 20 个交易日内命中 → 分档『提前』"
in_window = "起点日至事件结束日命中 → 分档『窗内』"
damage_window = "事件结束后 20 个交易日内命中 → 分档『损伤窗』"
miss = "事件结束 +20 日仍无命中 → 分档『漏』"
headline = "完全识别数 = 提前 + 窗内 + 损伤窗。三档分列不许合并冒充。"

[false_alarm]
definition = "命中日不在任何识别窗 [起点−20, 事件结束+20] 内 = 误报日；误报段 = 连续误报日最大连续段（识别窗边界切断）。"
metrics = "警戒占历史（命中日数/6483）、误报日数/年、误报段数/年、最长误报段。与 v0.13 同口径可直比。"

# ---------------------------------------------------------------------
# 三、补丁网格（34 行，计算前固定，无论好坏不删）
# ---------------------------------------------------------------------
[policies]
P2 = "底座行：弱三中二 = 3中2(五日跌四, 波动抬升, 半年线下)"
# 家族一：并联补丁（15 行）＝底座 ∪ 单信号（任一元件单独响即触发）
# 含底座自身三元件（相当于该元件一票通过），全覆盖不挑食
U = "并联补丁 = 弱三中二 ∪ X，X 遍历全部 15 信号（五日深跌/五日跌四/三日磨跌/单日跳水/波动高位/波动抬升/年线下/半年线下/回撤警报/深回撤/拓扑严/拓扑中/拓扑宽/顶部首裂/顶部警觉）"
# 家族二：表决扩容（12 行）＝4中2(五日跌四, 波动抬升, 半年线下, X)，X 遍历除底座三元件外的 12 信号
# 机制：共识接法——新元件须与旧元件之一共现才触发，预期噪音低于并联
K = "表决扩容 = 4中2(五日跌四, 波动抬升, 半年线下, X)，X ∈ 其余 12 信号"
# 家族三：内部换件/放宽（4 行）
S1 = "3中2(三日磨跌, 波动抬升, 半年线下)——深跌元件换磨跌"
S2 = "3中2(单日跳水, 波动抬升, 半年线下)——深跌元件换跳水"
S3 = "3中2(五日跌四, 波动抬升, 回撤警报)——年线元件换回撤"
S4 = "3中1(五日跌四, 波动抬升, 半年线下)——任一即响（放宽上限对照）"
# 对照行
REF8 = "对照：v0.13 实用候选（全词表并联折中档）"
REF1 = "对照：v0.13 基线机械混合"
grid_note = "家族划分是机制全覆盖（并联/表决/换件），非按 126 号拟合；34 行同表保留。"

[selection_rule]
hard = "硬资格：完全识别必须 45/45（补上 126 号、不丢其他）。"
primary = "合格者按警戒占历史升序取小（用户钉的主指标）。"
tie = "并列依次取：误报日/年小 → 提前数大 → 误报段/年小。"
disclose = "每行三档分布（提前/窗内/损伤窗）全披露；选定行与底座行逐事件对照（谁提前量改善/谁退让）。"
no_qualified = "若无一行通过硬资格：如实报告，取识别数最大行仅作描述，标注不得推荐。"

# ---------------------------------------------------------------------
# 四、口径与红线
# ---------------------------------------------------------------------
[accounting]
clock = "只做触发层词表补丁研究；判定机/预案/损益模拟不做。"
timing = "首次命中偏移 = 识别窗内首个命中日相对起点偏移；另记首响信号清单。"
reconcile = "底座行与对照行必须与 v0.13 对应行逐字段一致（对账断言）。"

[prohibitions]
- 不改 15 信号阈值/分位窗/最少观测——词表冻结
- 不按 45 事件结果删改网格行或反选参数——34 行同表保留
- 不把本版结果表述为实盘可达；全部为样本内描述性对账
- 不做显著性宣称；不做损益模拟
- 2025 测试集封存不动；不重判 v0.5 冻结判定

[outputs]
o1 = "outputs/regime_v015_lightpatch_summary.csv（34 行汇总）"
o2 = "outputs/regime_v015_lightpatch_matrix.csv（45 事件 × 34 政策识别矩阵）"
o3 = "outputs/regime_v015_lightpatch_false_alarm.csv（误报段记账）"
o4 = "outputs/regime_v015_lightpatch_manifest.json（清单与哈希）"
report = "outputs/crisis_lightpatch_v015_report.html"

[acceptance]
- 完整脚本独立运行两次，数据产物字节一致（清单时间戳除外）
- 底座行/对照行与 v0.13 逐字段对账一致
- 45 事件 × 34 政策全出数
- 可见文本零英文缩写（工程字段名只放悬停 title）

