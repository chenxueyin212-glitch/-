# regime_topo_window_v0.24b.toml —— 拓扑探测臂：2 年滚动分位变体
# 先登记后计算。登记时钟读数 2026-11-20T16:46:57+08:00，早于本臂任何计算输出。
# 目的：回答用户问题「3 年滚动分位不行，2 年滚动分位呢？」——只改滚动窗长度，
# 其余规则/阈值/状态机/评价口径与 v0.24 A 口径逐字相同，构成单变量对照。
# 本臂是探测（probe）变体，不改写 v0.23/v0.24，不触任何冻结层。

[meta]
version = "v0.24b"
registered_at = "2026-11-20T16:46:57+08:00"
purpose = "拓扑高侧签名触发器：滚动窗 756 日（3 年）→ 504 日（2 年）单变量对照"
status = "exploratory_probe_variant"
supersedes = ""            # 不取代 v0.24，两臂并列报告
output_prefix = "regime_v024b_topo_window"
parent = "regime_topo_probe_v0.24.toml"

[假设]
# v0.24 A 口径死因：2021 后拓扑中枢漂移（h1 中位 36→70），756 日窗被高位常态填满，
# 分散段高侧被稀释到 0.36~0.81，够不到 0.85。
# 改 504 日窗的两种相反机制，登记时都写明，事后不挑叙事：
#   有利机制：短窗更"局部"——窗内含 2026-03 共动段等低拓扑日，分散段的高值相对局部
#     窗口分布更极端，分位可能抬升过 0.85；
#   不利机制：短窗对中枢漂移适应更快，把高位更早当"常态"，高侧反而更稀。
# 主判据：分散五段（E11/E13/L2/L3/N3）的窗内分位中位是否系统性抬升且达 0.85 门槛。
h1 = "504 日滚动 rank 分位下，R1-R4 对漏保 9 事件捕获 > 0 且验证期两段有激活"
h2 = "误报不超过 v0.24 同臂（对照报告，不设为硬门槛）"

[阈值来源]
# 全部继承 v0.24，零新拟合；唯一改动 = hist_window。
pct_threshold = 0.85      # v0.16 票箱冻结的极值分位
low_threshold = 0.15      # 同上（R5 对照臂用）
dd_cut = -0.08            # v0.23 主口径
exit_dd = -0.04           # v0.23 主口径
pos_active = 0.7          # v0.23 主口径
recovery_days = 20        # v0.23 主口径
hist_window = 504         # ★本臂唯一改动：2 年 = 2×252（与 756=3×252 同约定）
min_periods = 120         # 同 v0.24
window_convention = "756=3年×252 → 504=2年×252；不采用 244/年折算，避免双约定"

[分位口径]
A2 = "504 日滚动 rank 分位（与 v0.24 A 口径唯一差别：窗长）"
# 本臂只跑 A2。B（固定训练参照）与 z250 的结果沿用 v0.24，不重算。

[候选规则]  # 与 v0.24 R1-R6 逐字相同，直接对照
R1 = "b_h1_count pct >= 0.85"
R2 = "b_h2_count pct >= 0.85"
R3 = "b_h2_landscape_l1 pct >= 0.85"
R4 = "R1 OR R2 OR R3（拓扑合并臂）"
R5 = "对照: b_xy_h0_death_mean pct <= 0.15（主门传染票同口径）"
R6 = "R4 OR (pr30>=2.50 AND corr30<=0.60)（加装臂：拓扑与 v0.23 相关几何取并集）"
R0 = "基线对照：v0.23 主口径（引用既有产物，不重算）"

[评价口径]  # 与 v0.23/v0.24 逐字相同
state_machine = "激活=规则AND dd20<=-8%；退出=dd20>-4%（滞回）；解除后 20 日线性回补 0.7→1.0"
coverage_mask = "45 事件窗(onset-5 → label_end+20) ∪ v0.18 验证期六段窗(同样±5/20 缓冲)"
false_alarm = "激活日 & ~covered；训练期= <=2025-04-07，验证期= >=2025-04-08"
event_pnl = "onset→worst+20td 简化损益：满仓 vs 通道仓位，乘积口径（同 v0.23）"
neg_gates = [
  "训练期误报 > 20 日/年 → 否",
  "训练期可评估漏保 9 事件捕获 = 0 → 否",
  "训练期捕获事件简化损益差合计 <= 0 → 否",
]

[污染披露]
# 与 v0.24 同等污染之上，本臂还有自适应性披露：
contamination = "2021/2022/2026 目标段在 v0.24 设计前已人工查验；本臂窗长系用户在看到 v0.24 否定结果后提出，属自适应探索；2025-04-08 后仍为准样本外"
adaptive = "窗长 504 由 756 失败结果启发而来，本臂结论只能是探测级线索，不能当独立确认证据"
escalation = "若本臂过门槛，升通道仍须另立正式版并另寻未见数据确认；不得以本臂替代 v0.23 主口径"

[禁止]
b1 = "不改写 v0.23/v0.24 及任何冻结文件"
b2 = "R1-R6 全部报告；不过否定门槛则保留否定结果如实报告"
b3 = "若 504 不行，不得在同一回合改试 488/378/252 等窗长追正——须另立探测臂另行登记"
b4 = "只改 hist_window 一处；阈值、状态机、掩码、门槛逐字不动"
