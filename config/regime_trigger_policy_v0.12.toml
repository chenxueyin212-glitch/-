# =====================================================================
# 预登记：触发层政策对比——区间检测与混合用能否替代『事件＋价格确认』
# 版本：v0.12
# 登记时间：2026-11-13T15:42:46+08:00
# 登记于任何 v0.12 计算之前
# =====================================================================

[meta]
purpose = "v0.11 审计发现：事件＋价格确认在 45 个历史事件里只通过 1 个（2015-07），触发层不可用。本版把『区间检测（多信号组合）』与『混合用（多轨并联）』做成预登记政策对比，回答：换触发层后覆盖、时点、误报与端到端价值各是多少。"
registered_before_results = true
base_version = "v0.11 四路径反事实（其结果冻结不动）"
not_a_trading_system = true
not_a_rejudge_of_v0_5 = true
not_a_modification_of_v0_11 = "v0.11 的四路径反事实、混淆矩阵、误判代价全部原样保留；本版只新增触发层对比与『触发版端到端敏感性』，任何结果（含否定结果）均保留并全表呈现"
note = "全部为样本内描述性对账；2025 年最终测试集继续封存；不外推为实盘可达收益"

[problem]
core_question = "重大事件＋价格确认（仅 1/45）不可用的前提下：改用区间检测（3 中 2 多信号）或混合用（多轨并联）后，能抓到多少事件、来得及吗、误报流掉多少、端到端还剩多少价值？"
unit = "触发时点（相对事件起点的交易日偏移，负＝提前）；端到端价值（每单位初始资本的全程累计收益差，百分点）"

# ---------------------------------------------------------------------
# 一、六条触发政策（全部同表呈现，无论优劣均保留；不按结果增删政策）
# ---------------------------------------------------------------------
[policies]
甲 = "事件＋价格确认（冻结窗）：重大事件（五类，事后已知）且价格确认在 [起点−2, 起点] 内通过 → 触发日 = 窗内首个通过日。与 v0.11 价格确认规则一字不改，作对照基线。"
甲延 = "事件＋价格确认（延展窗）：三子规则不变，窗扩至 [起点−2, 起点+5] → 触发日 = 窗内首个通过日。新变体（机制假设：价格确认滞后于事件识别，冻结窗把滞后日排除了）；与甲同时登记、无论谁好谁坏均保留。"
乙 = "区间检测（多信号组合，v0.11 冻结规则原样）：3 中 2 即触发——① 5 个交易日累计跌幅 ≤ −6%；② 20 日已实现波动率 > 过去 3 年（756 交易日）的 80 分位；③ 收盘价 < 250 日移动平均线。触发日 = 命中日。"
丙 = "拓扑警戒（v0.11 冻结规则原样）：7 项危机敏感特征中 ≥ 4 项进入各自滚动 3 年历史 85 分位（方向感知）→ 触发日 = 命中日。v0.9 结论『不能单飞』，本版纳入只为量化其单独表现。"
丁 = "混合用（全信息并联）= 甲延 ∪ 乙 ∪ 丙：任一轨在某日命中 → 该日为触发日。产品推荐候选。"
戊 = "机械混合（无人工事件信息）= 乙 ∪ 丙：纯市场数据可实现的并联，不依赖新闻/公告信息源。"
甲延_note = "甲延的窗选择在计算前登记（机制假设驱动，不是看过结果后的追正）；甲与甲延同时登记、同时出全表"

# ---------------------------------------------------------------------
# 二、事件归属与第 0 天（触发版端到端）
# ---------------------------------------------------------------------
[attribution]
catch_window = "事件归属窗 = [起点−20, 事件结束]；该政策在窗内的首个命中日 = 本事件的触发日（端到端第 0 天）"
lead_lag = "触发偏移 = 触发日 − 起点（负＝提前、正＝滞后）；逐事件报"
rearm_disclosure = "对持续性命中（如均线破位长期为真），窗内首个命中日相当于在窗内重新武装，对持续性信号偏乐观；持续性命中的真实代价在误报段评估中体现（每段只有一次判定机会）"
multi_event = "逐事件独立评估（与 v0.11 同）；一次命中可同时归入相邻两事件的归属窗，如实披露"
no_fire = "归属窗内无命中的事件记『未触发』：四路径差异 = 0（实盘抓不到就无法行动），计入中位数（诚实拉向 0）"

# ---------------------------------------------------------------------
# 三、触发版端到端（时钟原点 = 触发日）
# ---------------------------------------------------------------------
[endtoend]
day0 = "归属窗内首个命中日；仅换时钟原点，v0.11 的判定机、预案、止损、认沽、回补、复利全部原样"
judgment = "v0.11 逐日判定规则原样：基线窗 = 第 0 天前 10 个交易日（非空 ≥ 8）；当前窗 = 第 0 天至第 k 日（非空 ≥ 80%）；判定窗 = 第 1–20 个交易日；连续 2 日同向 + 确认日危机确认分 ≥ 4/7；确认日 < 事件结束日才具切换资格；纠错最多 1 次"
paths = "P1 套对 / P2 套错（触发后第 2 个交易日收盘切换，用真型/反型）/ P3 满仓 / P4 实时判定；P3b 敏感性（基线 + 常规止损 8%）照报"
window_mismatch_disclosure = "触发提前量大时，20 日判定窗可能在危机到来前关闭（拓扑警戒尤甚）——『判定窗长度与触发提前量失配』属产品设计发现，本版按冻结规则如实记账，不改判定窗"
comparison_with_v011 = "检测层折价 = v0.11（已知起点）的对比中位 − v0.12（触发版）的对应中位；只报数字，不做显著性宣称"
windows_note = "触发版的损益窗 = [触发日−1 收盘 → 事件结束 + 20 交易日收盘]，与 v0.11 窗口起点不同；对比一律用『同一窗内的路径差』（如 P4−P3），不跨窗比绝对收益"

# ---------------------------------------------------------------------
# 四、误报与误报代价
# ---------------------------------------------------------------------
[false_alarm]
definition = "误报段 = 连续命中日构成的极大段（交易日相邻即连通），且该段与任何事件的归属窗 [起点−20, 事件结束] 均不相交"
measurable = "乙/丙/丁/戊可度量（纯市场数据）；甲/甲延的误报取决于事件信息源质量（信息源报了重大事件但实际无危机、或价格确认通过但非危机），市场数据无法度量——如实披露，不硬造"
episode_cost = """
误报段首次命中日 = 第 0 天；判定机照常运行（第 1–20 日）；
切换资格 = 确认日偏移 < 20（与事件侧『至少留 1 个生效日』同构）；
预案自切换次一交易日起生效；
事件结束代理 = 第 0 天 + 20 个交易日（取判定窗长度，新约定，仅用于误报代价估计，不用于事件侧）；
止损监测至事件结束代理日；回补 = 事件结束代理日起 20 交易日线性；认沽到期 = 事件结束代理 + 20 交易日。
"""
cost_metric = "每段：预案全程累计 − 基线全程累计（窗 = 第 0 天前一交易日 → 事件结束代理 + 20 交易日）；逐段列表 + 合计 + 每年平均（样本 ≈ 25.9 年）均报"
skip_rule = "第 0 天 + 40 交易日超出样本末尾的误报段跳过（如实计数为『随访不足跳过』）"

# ---------------------------------------------------------------------
# 五、汇总口径
# ---------------------------------------------------------------------
[summary_metrics]
per_policy = [
  "捕获数 / 捕获率（归属窗内有触发日的事件数 ÷ 45）",
  "触发偏移中位（负＝提前）与四分位",
  "几何可行数（触发偏移 + 2 < 事件结束偏移，即第 2 日切换仍赶得上危机内生效）",
  "端到端已切换数（路径四判定出类型并切换）",
  "P1−P3 中位、P4−P3 中位（全 45，含未触发记 0）、P4−P3 中位（仅已触发子集）",
  "误报段数 / 年、误报段触发预案数、误报代价合计（百分点）与每段中位",
  "参考净账（合计口径）= 事件侧 P4−P3 合计 − 误报代价合计（只作参照，不做显著性宣称）",
]
cross_policy_note = "六政策同表；不选『最好』的当结论——结论按覆盖、时点、误报、净账四个维度综合陈述"

# ---------------------------------------------------------------------
# 六、样本与输入
# ---------------------------------------------------------------------
[sample]
events = "v0.8 冻结的 45 个统计事件（前段 28 + 后段 17）；外部锚点 18/19 不进入"
true_labels = "regime_v08_typology_event_profiles.csv 的 cluster_k2（1 = 状态扩张型/深慢，2 = 相关重构型/浅快）"
inputs = [
  "regime_v07_split_wide.csv（拓扑特征宽表，6483×67）",
  "regime_v05_benchmark_daily.csv（真万得全A 收盘）",
  "regime_v08_typology_event_profiles.csv（真型标签）",
  "crisis_context_v07_event_windows.csv（开盘/成交额，价格确认子规则②用）",
  "regime_v011_counterfactual_event_pnl.csv（已知起点对照，只读）",
]
missing_policy = "缺失记空值、不补零不插值；价格确认子规则②可用成交额日 < 15 时记不可用（与 v0.11 同）"

# ---------------------------------------------------------------------
# 七、输出
# ---------------------------------------------------------------------
[outputs]
prefix = "regime_v012_"
files = [
  "regime_v012_trigger_event_timing.csv",    # 逐事件 × 六政策 触发时点与可行性
  "regime_v012_trigger_false_alarm.csv",     # 误报段逐段清单与代价
  "regime_v012_endtoend_event_pnl.csv",      # 逐事件 × 六政策 触发版四路径损益
  "regime_v012_trigger_policy_summary.csv",  # 六政策汇总对比表
  "regime_v012_trigger_manifest.json",
]
report = "crisis_trigger_policy_v012_report.html（离线单文件中文报告；可见文本零英文缩写；工程字段名只放悬停）"

# ---------------------------------------------------------------------
# 八、验收
# ---------------------------------------------------------------------
[acceptance]
double_run = "完整脚本独立运行两次，数据产物字节一致（清单时间戳除外）"
determinism = "无随机数、无自助、无置换；全流程确定性"

# ---------------------------------------------------------------------
# 九、禁止事项（红线）
# ---------------------------------------------------------------------
[prohibitions]
- 不重判十四条推测；不改 config/study.toml 与 v0.5—v0.11 任何冻结产物（v0.11 报告与数据原样保留）
- 不反选参数：归属窗 [−20, 事件结束]、甲延窗 [−2, +5]、误报段约定、判定窗 20 日、切换资格、预案仓位/止损/认沽全部按本预登记执行
- 不按结果增删政策或改窗；六政策无论优劣全表呈现，否定结果同样保留
- 不读取或评分 2025 年最终测试集；第一道闸门仍暂停，第二道闸门未启动
- 不把本版结果表述为策略收益承诺或实盘可达收益；全部为样本内描述性对账
- 路径一是上限（分类完美），不得当产品收益；产品成绩以路径四为准
- 不做组均值显著性宣称；逐事件/逐段列表呈现
- 『参考净账』（事件侧合计减误报合计）只作参照口径，不是组合回测、不含换手摩擦、不做跨窗复利

