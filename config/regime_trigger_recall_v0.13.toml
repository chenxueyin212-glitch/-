# =====================================================================
# 预登记：v0.13 召回优先高敏触发器研究（先登记后计算）
# 登记时间：2026-11-14T12:21:03+08:00
# 登记于任何计算之前。本文只追加、不回改；更正进追加修订区。
# ---------------------------------------------------------------------
# 背景与目标（用户 2026-11-14 指令）
#   v0.12 覆盖审计：最好的触发政策（混合用）也只抓 29/45，16 个危机全程
#   零警报，且六政策全漏同一批——不是参数问题，是信号词表盲区。
#   用户指令：这 45 个危机是用未来视角定下的地基，把它们全部识别出来是
#   最基础的要求，需要更加敏锐的触发器；误报率做到之后再着手降。
#   → 本版是【召回优先】的触发器词表研究：主指标=45 事件识别率与时点，
#     误报只记账、不治理、不做损益模拟。
# =====================================================================

[meta]
version = "v0.13"
title = "召回优先高敏触发器研究"
created = "2026-11-14T12:21:03+08:00"
purpose = "在『45 个冻结事件全部识别』的硬要求下，扩展并放宽触发信号词表，给出识别率—时点—误报的完整对照；误报治理押后。"
discipline = "先登记后计算；信号阈值全部机制驱动、计算前固定；全部变体同表保留、无论好坏不删；无随机数、无参数反选。"

# ---------------------------------------------------------------------
# 一、样本与识别窗（时点分档）
# ---------------------------------------------------------------------
[sample]
events = "45 个冻结统计事件（前段 28：101—128；后段 17：1—17）。外部锚点 18/19 不进。起止沿用 v0.12 触发表，不再重算。"
calendar = "regime_v07_split_wide.csv 全日历 6483 个交易日（1999-12-30 起）。"

[identification_window]
# 识别窗 = [起点−20, 事件结束+20]（含损伤窗——事后 20 日损伤仍在兑现，
# 损伤窗内的触发对残余损伤仍有部分保护价值，故计『识别』但单列分档）。
pre = "起点前 20 个交易日内命中 → 分档『提前』"
in_window = "起点日至事件结束日命中 → 分档『窗内』"
damage_window = "事件结束后 20 个交易日内命中 → 分档『损伤窗』（只对残余损伤有部分保护）"
miss = "事件结束 +20 日仍无命中 → 分档『漏』"
headline = "完全识别数 = 提前 + 窗内 + 损伤窗。主表三档分列，不许合并冒充。"
disclose = "识别窗含损伤窗，比 v0.12 归属窗（止于事件结束）宽 20 日——宽口径是本版定义，跨版误报数不可直接比。"

# ---------------------------------------------------------------------
# 二、单信号词表（15 项，阈值计算前固定，机制驱动不按事件拟合）
# ---------------------------------------------------------------------
[signals]
# 跌势响应类（价格）
D1 = "五日累计 ≤ −6%（v0.12 现行）"
D2 = "五日累计 ≤ −4%（放宽：捕捉慢跌，2018 型阴跌常不达 −6%）"
D3 = "三日累计 ≤ −3.5%（新：磨跌型，周窗永远踩不到的阴跌）"
D4 = "单日 ≤ −2%（新：跳水/缺口日）"
# 波动类
V1 = "20 日已实现波动率 > 过去 3 年（756 日）80 分位（v0.12 现行）"
V2 = "20 日已实现波动率 > 70 分位（放宽：更早的波动抬升）"
# 趋势类
M1 = "收盘 < 250 日均线（v0.12 现行）"
M2 = "收盘 < 120 日均线（放宽：中期趋势破坏更早现形）"
# 回撤类（新）
R1 = "距 20 日最高收盘回撤 ≥ 5%（新：顶部反转初段）"
R2 = "距 60 日最高收盘回撤 ≥ 8%（新：更深的顶部破坏）"
# 拓扑警戒类
T1 = "7 项危机敏感特征 ≥4 项入各自滚动 3 年 85 分位（v0.11/v0.12 现行）"
T2 = "≥3 项入 85 分位（放宽敏感度）"
T3 = "≥4 项入 80 分位（放宽分位）"
# 顶部预警类（新——针对 124/11 号这类『窗内零跌幅的顶部反转』盲区）
H1 = "过去 3 个交易日内创 20 日新高，且当日收跌 ≤ −1%（顶部首裂）"
H2 = "过去 3 个交易日内创 20 日新高，且当日收跌 < 0（顶部警觉，更宽）"
# 公共口径
rolling_note = "波动率分位窗 756 日、最少 250 观测（沿用 v0.12）；拓扑分位窗 756 日、最少 120 观测（沿用 v0.11）；均线/新高/回撤窗最少满窗观测。"
topo_features = "a16_avg_pair_corr、a16_leading_eig_share、b_industry_average_correlation（升向）；b_h2_count、b_h1_count、b_h2_landscape_l1、b_xy_h0_death_mean（降向）——v0.11 冻结清单原样。"

# ---------------------------------------------------------------------
# 三、组合政策（8 条，同表保留、无论好坏不删）
# ---------------------------------------------------------------------
[policies]
P1 = "基线机械混合（对照）= v0.12 戊 = 3中2(D1,V1,M1) ∪ T1"
P2 = "弱三中二 = 3中2(D2,V2,M2)"
P3 = "跌势任一 = D1∪D2∪D3∪D4∪V1∪V2∪M1∪M2∪R1∪R2（跌势词表全并联，任一命中即触发）"
P4 = "拓扑放宽 = T1∪T2∪T3"
P5 = "顶部预警 = H1∪H2"
P6 = "无顶部全量 = P3∪P4（全词表并联但不含顶部预警——用于隔离顶部预警的边际贡献）"
P7 = "全量哨响 = P3∪P4∪P5（召回上限探针）"
P8 = "实用候选 = P2∪D4∪R1∪P4∪P5（弱三中二＋单日跳水＋回撤警报＋拓扑放宽＋顶部预警；不含 M1/M2/V1/V2/R2 单独触发，噪音低于 P7 的折中档）"
selection_rule = "推荐规则（计算前固定）：先比完全识别数（提前+窗内+损伤窗）取大；并列时比归属窗外命中日数/年取小。推荐结果标注『样本内选定』。"

# ---------------------------------------------------------------------
# 四、误报记账（只记账不治理——用户指令）
# ---------------------------------------------------------------------
[false_alarm]
definition = "命中日不在任何事件识别窗 [起点−20, 事件结束+20] 内 = 误报日。误报段 = 连续误报日的最大连续段（长段在识别窗边界处切断）。"
metrics = "误报日数/年、误报段数/年、最长误报段、识别窗外命中日合计。年 = 6483/250。"
disclose = "段定义与 v0.12 不同（v0.12 先聚命中长段再判相交；本版按识别窗边界切分、逐日归属）——更严也更诚实，跨版段数不可直接比。"
governance = "撤销机制、冷却期、误报代价模拟全部不做——用户指令『做到了以后再着手降』。"

# ---------------------------------------------------------------------
# 五、口径与红线
# ---------------------------------------------------------------------
[accounting]
clock = "只做触发层时点研究，不做判定机/预案/损益模拟（那是 v0.11/v0.12 的事）。"
timing = "首次命中偏移 = 首个识别窗内命中日相对起点的交易日偏移（负=提前）。另记窗内命中信号清单（说明为何抓到）。"
attribution_window = "[起点−20, 事件结束+20]；与 v0.12 归属窗差异见 [identification_window] 披露。"

[prohibitions]
- 不按 45 事件结果反选阈值或删改词表——全部 15 信号、8 政策同表保留
- 不把本版结果表述为实盘可达；全部为样本内描述性对账
- 不做显著性宣称；逐事件/逐信号列表呈现
- 误报治理（撤销/冷却/代价）本版不做、只记账
- 2025 测试集封存不动；不重判 v0.5 冻结判定
- 触发 ≠ 保护：损伤窗识别只对残余损伤有部分保护，报告必须分档

[outputs]
o1 = "outputs/regime_v013_trigger_signal_census.csv（15 单信号普查）"
o2 = "outputs/regime_v013_trigger_policy_matrix.csv（45 事件 × 8 政策识别矩阵）"
o3 = "outputs/regime_v013_trigger_policy_summary.csv（8 政策汇总）"
o4 = "outputs/regime_v013_trigger_false_alarm.csv（误报段记账）"
o5 = "outputs/regime_v013_trigger_manifest.json（清单与哈希）"
report = "outputs/crisis_trigger_recall_v013_report.html"

[acceptance]
- 完整脚本独立运行两次，数据产物字节一致（清单时间戳除外）
- 可见文本零英文缩写（工程字段名只放悬停 title）
- 45 事件全部入账、15 信号 8 政策全出数

